<script id="veri" type="application/json">{"uretim": "2026-09-10T22:20:50", "son_dogrulama": "2026-09-10", "kategoriler": [{"id": "temel-kavramlar", "ad": "Temel Kavramlar", "seviye": "temel", "dosya": "01-temel-kavramlar.md", "kart_sayisi": 4}, {"id": "dikey-atmosfer", "ad": "Dikey Atmosfer", "seviye": "orta", "dosya": "02-dikey-atmosfer.md", "kart_sayisi": 4}, {"id": "yagis-ve-bulutlar", "ad": "Yağış ve Bulutlar", "seviye": "temel", "dosya": "03-yagis-ve-bulutlar.md", "kart_sayisi": 5}, {"id": "radar-ve-modeller", "ad": "Radar ve Modeller", "seviye": "orta", "dosya": "04-radar-ve-modeller.md", "kart_sayisi": 3}, {"id": "uygulamali", "ad": "Uygulamalı", "seviye": "temel", "dosya": "05-uygulamali.md", "kart_sayisi": 3}, {"id": "acik-veri-ve-sensorler", "ad": "Açık Veri ve Sensörler", "seviye": "ileri", "dosya": "06-acik-veri.md", "kart_sayisi": 2}], "kartlar": [{"id": "cig-noktasi-cig-sicakligi-nedir", "baslik": "Çiğ Noktası (Çiğ Sıcaklığı) Nedir?", "kategori": "Temel Kavramlar", "kategori_id": "temel-kavramlar", "seviye": "temel", "etiketler": ["çiğ noktası", "nem", "hissedilen sıcaklık", "ısı adası", "basınç"], "dosya": "01-temel-kavramlar.md", "sira": 0, "kisa_tanim_duz": "Havanın, içindeki su buharı miktarı değişmeden soğutulduğunda doyuma ulaşıp yoğuşmanın (çiğ, sis, bulut) başladığı sıcaklıktır. Havadaki gerçek nem miktarının en dürüst göstergesidir.", "alanlar": {"kisa_tanim": "<p>Havanın, içindeki su buharı miktarı değişmeden soğutulduğunda doyuma ulaşıp yoğuşmanın (çiğ, sis, bulut) başladığı sıcaklıktır. Havadaki gerçek nem miktarının en dürüst göstergesidir.<\/p>", "esik": "<ul><li>Çiğ noktası ≤ hava sıcaklığı her zaman geçerlidir; ikisi eşitse bağıl nem %100'dür.<\/li><li>Yaklaşık hesap (Magnus formülü): <code>Td ≈ T − ((100 − RH) / 5)<\/code> (RH &gt; %50 için ±1°C hata)<\/li><li>Konfor eşikleri:<\/li><\/ul><div class=\"tablo\"><table><thead><tr><th>Çiğ noktası<\/th><th>His<\/th><\/tr><\/thead><tbody><tr><td>&lt; 10°C<\/td><td>Kuru, ferah<\/td><\/tr><tr><td>10–15°C<\/td><td>Rahat<\/td><\/tr><tr><td>16–20°C<\/td><td>Nemli, yapışkan<\/td><\/tr><tr><td>21–24°C<\/td><td>Bunaltıcı<\/td><\/tr><tr><td>&gt; 24°C<\/td><td>Aşırı bunaltıcı, sağlık riski<\/td><\/tr><\/tbody><\/table><\/div>", "nasil": "<p>Hava belirli bir sıcaklıkta belirli miktarda su buharı taşıyabilir. Sıcaklık düştükçe bu kapasite azalır; çiğ noktasına inildiğinde hava \"dolar\" ve fazla buhar sıvıya dönüşür. Bağıl nem sıcaklıkla değişir ama çiğ noktası, havaya nem eklenmedikçe veya çıkarılmadıkça sabit kalır — bu yüzden \"gerçek nem\" ölçüsüdür.<\/p>", "ornek": "<p>Antalya'da yaz gecesi 26°C'de çiğ noktası 23°C ise gece bunaltıcıdır. Ankara'da aynı 26°C'de çiğ noktası 8°C ise akşam serinler ve terleme kolayca buharlaşır. Sabah araba camındaki çiğ, gece sıcaklığının çiğ noktasına ulaştığını gösterir.<\/p>", "hata": "<p>\"Bağıl nem %90, çok nemli\" demek. Ocak ayında 2°C'de %90 nem, havada çok az su olduğu anlamına gelir; aynı %90 nem Ağustos'ta 30°C'de bunaltıcıdır. Karşılaştırma için çiğ noktasına bakın.<\/p>"}, "kaynaklar": ["NOAA / NWS Glossary — çiğ noktası tanımı ve konfor tablosu", "MGM Meteoroloji Sözlüğü — \"çiy noktası sıcaklığı\" tanımı", "Lawrence (2005), <em>Bull. Amer. Meteor. Soc.<\/em> — Magnus yaklaşık formülü ve hata payı"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "(konfor tablosu sınırları kaynaklar arasında ±1°C oynar, önemsiz)", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "hissedilen-sicaklik-nasil-hesaplanir", "baslik": "Hissedilen Sıcaklık Nasıl Hesaplanır?", "kategori": "Temel Kavramlar", "kategori_id": "temel-kavramlar", "seviye": "temel", "etiketler": ["çiğ noktası", "nem", "hissedilen sıcaklık", "ısı adası", "basınç"], "dosya": "01-temel-kavramlar.md", "sira": 1, "kisa_tanim_duz": "Termometrenin gösterdiği değil, rüzgâr ve nemin etkisiyle insan vücudunun algıladığı sıcaklıktır. Soğukta rüzgâr soğutma (wind chill), sıcakta ısı indeksi (heat index) kullanılır.", "alanlar": {"kisa_tanim": "<p>Termometrenin gösterdiği değil, rüzgâr ve nemin etkisiyle insan vücudunun algıladığı sıcaklıktır. Soğukta rüzgâr soğutma (wind chill), sıcakta ısı indeksi (heat index) kullanılır.<\/p>", "esik": "<ul><li><strong>Rüzgâr soğutma<\/strong> (T ≤ 10°C ve rüzgâr ≥ 4,8 km/sa iken): <code>Twc = 13,12 + 0,6215·T − 11,37·V^0,16 + 0,3965·T·V^0,16<\/code> (T: °C, V: 10 m yükseklikteki rüzgâr hızı, km/sa)<\/li><li><strong>Isı indeksi<\/strong> (T ≥ 27°C ve RH ≥ %40 iken): Rothfusz regresyonu; pratikte NWS tablosu kullanılır.<\/li><li><strong>Humidex<\/strong> (Kanada): <code>H = T + 0,5555·(e − 10)<\/code>, e: buhar basıncı (hPa)<\/li><li>Örnek değerler:<\/li><\/ul><div class=\"tablo\"><table><thead><tr><th>Sıcaklık<\/th><th>Rüzgâr / Nem<\/th><th>Hissedilen<\/th><\/tr><\/thead><tbody><tr><td>0°C<\/td><td>30 km/sa rüzgâr<\/td><td>−6°C<\/td><\/tr><tr><td>−10°C<\/td><td>40 km/sa rüzgâr<\/td><td>−21°C<\/td><\/tr><tr><td>32°C<\/td><td>%60 nem<\/td><td>38°C<\/td><\/tr><tr><td>35°C<\/td><td>%70 nem<\/td><td>47°C<\/td><\/tr><\/tbody><\/table><\/div>", "nasil": "<p>Rüzgâr, vücudu saran ince ılık hava tabakasını süpürerek ısı kaybını hızlandırır. Nem ise terin buharlaşmasını yavaşlatır; vücut kendini soğutamaz. Her iki formül de deneysel olarak insan denekler üzerinde kalibre edilmiştir; fiziksel bir ölçüm değil, bir \"eşdeğer sıcaklık\"tır.<\/p>", "ornek": "<p>Erzurum'da −8°C ve 35 km/sa rüzgârda hissedilen −18°C'dir; açıkta kalan deri 30 dakikada donma riski taşır. Adana'da 36°C ve %55 nemde hissedilen 45°C'dir; bu, ısı çarpması eşiğidir.<\/p>", "hata": "<p>Rüzgâr soğutmanın nesneleri de daha soğuk yaptığını sanmak. Rüzgâr, arabanın radyatörünü hava sıcaklığının altına soğutamaz; sadece o sıcaklığa daha hızlı ulaştırır.<\/p>"}, "kaynaklar": ["Environment Canada / NWS ortak Wind Chill formülü (2001) — katsayılar", "NWS Heat Index tablosu (Rothfusz 1990) — ısı indeksi", "MGM \"Hissedilen Sıcaklık\" açıklama sayfası — Türkiye'de kullanılan yöntem"], "tutarlilik": {"seviye": "orta", "simge": "🟡", "not": "3/3 tanımda hemfikir, formülde 2 farklı yaklaşım", "dogrulama": "2026-09-08", "celiski": "Sıcak taraf için ABD \"heat index\", Kanada \"humidex\", bazı Avrupa ülkeleri \"apparent temperature\" (Steadman) kullanır; aynı koşulda 2–3°C fark çıkabilir. Kart, en yaygın olan NWS yöntemini esas alır.", "yeniden_dogrulama": null, "seviye_adi": "Orta"}}, {"id": "sehir-isi-adasi-kentsel-isi-adasi-nedir", "baslik": "Şehir Isı Adası (Kentsel Isı Adası) Nedir?", "kategori": "Temel Kavramlar", "kategori_id": "temel-kavramlar", "seviye": "temel", "etiketler": ["çiğ noktası", "nem", "hissedilen sıcaklık", "ısı adası", "basınç"], "dosya": "01-temel-kavramlar.md", "sira": 2, "kisa_tanim_duz": "Şehir merkezinin, çevresindeki kırsal alandan belirgin biçimde daha sıcak olması olayıdır. En güçlü etki gece görülür.", "alanlar": {"kisa_tanim": "<p>Şehir merkezinin, çevresindeki kırsal alandan belirgin biçimde daha sıcak olması olayıdır. En güçlü etki gece görülür.<\/p>", "esik": "<ul><li>Tipik fark: gündüz 1–3°C, açık ve sakin gecelerde 5–10°C<\/li><li>Etki, rüzgâr hızı 5 m/s'yi aştığında büyük ölçüde silinir<\/li><li>Şehir büyüklüğü ile logaritmik artar (Oke, 1973): <code>ΔT ≈ 2,01·log₁₀(nüfus) − 4,06<\/code> (Avrupa şehirleri için, sakin açık gecelerde)<\/li><\/ul>", "nasil": "<p>Beton ve asfalt gündüz güneş ısısını depolar, gece yavaş bırakır. Binalar yüzey alanını artırır ve rüzgârı keser; yeşil alan azlığı buharlaşma soğutmasını ortadan kaldırır. Araç ve klima atık ısısı eklenir. Sonuç: şehir gece soğuyamaz.<\/p>", "ornek": "<p>İstanbul'da Temmuz gecesi Şişli'de 27°C ölçülürken Şile'de 20°C olabilir. Ankara Kızılay'da kar yağmazken Gölbaşı'nda kar tutması, kış ısı adasının etkisidir.<\/p>", "hata": "<p>Isı adasını \"küresel ısınma kanıtı\" ya da \"kanıt değil\" diye tartışmaya sokmak. Isı adası yerel bir etkidir; küresel sıcaklık serileri bu etki için düzeltilir.<\/p>"}, "kaynaklar": ["Oke, T.R. (1982) <em>Q. J. R. Meteorol. Soc.<\/em> — tanım, gece maksimumu, nüfus ilişkisi", "US EPA \"Heat Island Effect\" — 1–3°C gündüz, 12°C'ye kadar gece değerleri", "İTÜ / TÜBİTAK İstanbul kentsel ısı adası çalışmaları — Türkiye örnekleri"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "(maksimum gece farkı EPA'da 12°C, Oke'de 10°C; aralık olarak verildi)", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "alcak-ve-yuksek-basinc-ne-yapar", "baslik": "Alçak ve Yüksek Basınç Ne Yapar?", "kategori": "Temel Kavramlar", "kategori_id": "temel-kavramlar", "seviye": "temel", "etiketler": ["çiğ noktası", "nem", "hissedilen sıcaklık", "ısı adası", "basınç"], "dosya": "01-temel-kavramlar.md", "sira": 3, "kisa_tanim_duz": "Alçak basınç merkezi (L / A) yükselen hava, bulut ve yağış getirir; yüksek basınç merkezi (H / Y) alçalan hava, açık gökyüzü ve durgunluk getirir.", "alanlar": {"kisa_tanim": "<p>Alçak basınç merkezi (L / A) yükselen hava, bulut ve yağış getirir; yüksek basınç merkezi (H / Y) alçalan hava, açık gökyüzü ve durgunluk getirir.<\/p>", "esik": "<ul><li>Deniz seviyesi standart basınç: 1013,25 hPa<\/li><li>Pratik eşikler: &lt; 1000 hPa belirgin alçak, &gt; 1025 hPa belirgin yüksek<\/li><li>3 saatte ≥ 3 hPa düşüş: yaklaşan cephe/fırtına işareti<\/li><li>Kuzey yarımkürede rüzgâr: alçak etrafında saat yönünün tersine ve içe, yüksek etrafında saat yönünde ve dışa<\/li><\/ul>", "nasil": "<p>Yüzeyde hava alçak basınca doğru akar, merkezde birleşip yükselir; yükselen hava soğur, nem yoğuşur, bulut ve yağış oluşur. Yüksek basınçta hava yukarıdan çöker, çökerken ısınır ve kurur; bulut dağılır. Kışın yüksek basınç altında hava sakin kaldığı için yerde sis, don ve inversiyon (yerde soğuk, yukarıda ılık hava) görülür — hava kirliliği de bu yüzden birikir.<\/p>", "ornek": "<p>Kasım'da Balkanlar üzerinden gelen alçak basınç Marmara'ya yağış getirir. Ocak'ta Sibirya yüksek basıncı İç Anadolu'ya açık, çok soğuk ve sisli sabahlar getirir; Ankara'da −15°C ve aynı anda Uludağ zirvesinde −5°C ölçülmesi inversiyondur.<\/p>", "hata": "<p>\"Yüksek basınç = güzel hava\" sanmak. Kışın yüksek basınç, en soğuk geceleri, en yoğun sisi ve en kirli havayı getirir.<\/p>"}, "kaynaklar": ["Met Office \"High and low pressure\" — mekanizma ve rüzgâr yönü", "NWS JetStream — basınç sistemleri dersi", "MGM Sinoptik Haritalar sayfası — sembol ve eşik kullanımı"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "irtifa-ile-sicaklik-nasil-duser", "baslik": "İrtifa ile Sıcaklık Nasıl Düşer?", "kategori": "Dikey Atmosfer", "kategori_id": "dikey-atmosfer", "seviye": "orta", "etiketler": ["irtifa", "lapse rate", "kar sınırı", "850 hPa", "dağ", "orografik"], "dosya": "02-dikey-atmosfer.md", "sira": 100, "kisa_tanim_duz": "Troposferde yükseldikçe sıcaklık ortalama her 1000 metrede yaklaşık 6,5°C düşer. Buna \"sıcaklık düşme oranı\" (lapse rate) denir; günün ve nemin durumuna göre 4 ile 10°C/km arasında değişir.", "alanlar": {"kisa_tanim": "<p>Troposferde yükseldikçe sıcaklık ortalama her 1000 metrede yaklaşık 6,5°C düşer. Buna \"sıcaklık düşme oranı\" (lapse rate) denir; günün ve nemin durumuna göre 4 ile 10°C/km arasında değişir.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>Oran<\/th><th>Değer<\/th><th>Ne zaman geçerli<\/th><\/tr><\/thead><tbody><tr><td>Standart atmosfer (ICAO)<\/td><td>6,5°C / 1000 m<\/td><td>Uzun dönem ortalama<\/td><\/tr><tr><td>Kuru adyabatik<\/td><td>9,8°C / 1000 m<\/td><td>Doymamış hava yükselirken<\/td><\/tr><tr><td>Nemli (doygun) adyabatik<\/td><td>4–7°C / 1000 m (ort. ~6)<\/td><td>Bulut içinde yükselen hava<\/td><\/tr><tr><td>İnversiyon<\/td><td>Sıcaklık artar<\/td><td>Sakin kış geceleri, vadiler<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Pratik kural: <strong>100 m'de ≈ 0,65°C<\/strong>, yani 1500 m'lik bir dağ tabandan ~10°C soğuk olur.<\/li><\/ul>", "nasil": "<p>Yükseldikçe basınç düşer, hava genleşir; genleşme iş yapar ve hava soğur (adyabatik soğuma). Kuru hava 9,8°C/km soğur. Hava doyunca yoğuşma ısısı açığa çıkar ve soğuma yavaşlar (nemli oran). Gerçek atmosferde ölçülen ortalama 6,5°C/km, bu ikisinin karışımıdır. Yeryüzü geceleri ışınımla soğuduğunda yere yakın hava yukarıdakinden soğuk kalır: inversiyon.<\/p>", "ornek": "<p>Bursa'da (100 m) 12°C ölçülürken Uludağ Oteller Bölgesi'nde (1900 m) yaklaşık 0°C beklenir. Antalya'da (10 m) 30°C iken Saklıkent'te (1850 m) 18°C dolayında olur.<\/p>", "hata": "<p>6,5°C/km'yi her zaman geçerli sanmak. Kış sabahlarında Ankara'da (900 m) −12°C, Elmadağ zirvesinde (1850 m) −4°C olabilir; inversiyon oranı tersine çevirir.<\/p>"}, "kaynaklar": ["ICAO Standard Atmosphere (1993) — 6,5 K/km", "Wallace &amp; Hobbs, <em>Atmospheric Science<\/em> (2006) — kuru ve nemli adyabatik oranlar", "NWS JetStream \"Lapse rate\" — pratik değerler"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "(nemli adyabatik oran sıcaklığa bağlı olduğu için aralık verildi)", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "kar-siniri-nedir", "baslik": "Kar Sınırı Nedir?", "kategori": "Dikey Atmosfer", "kategori_id": "dikey-atmosfer", "seviye": "orta", "etiketler": ["irtifa", "lapse rate", "kar sınırı", "850 hPa", "dağ", "orografik"], "dosya": "02-dikey-atmosfer.md", "sira": 101, "kisa_tanim_duz": "Yağışın yağmur olarak değil kar olarak düştüğü en alçak yükseklik seviyesidir. Genellikle donma seviyesinin (0°C izotermi) 200–400 m altındadır.", "alanlar": {"kisa_tanim": "<p>Yağışın yağmur olarak değil kar olarak düştüğü en alçak yükseklik seviyesidir. Genellikle donma seviyesinin (0°C izotermi) 200–400 m altındadır.<\/p>", "esik": "<ul><li><strong>Donma seviyesi (freezing level):<\/strong> Atmosferde sıcaklığın 0°C olduğu yükseklik. Model haritalarında \"0°C isotherm / freezing level\" olarak verilir.<\/li><li><strong>Kar sınırı ≈ Donma seviyesi − 300 m<\/strong> (aralık: 200–400 m)<\/li><li>Yoğun yağışta kar sınırı 500–600 m'ye kadar aşağı iner (kar taneleri erirken havayı soğutur).<\/li><li>Kar tanesi yere ulaşırken sıcaklık +2°C'ye kadar kar olarak kalabilir; belirleyici olan <strong>ıslak termometre sıcaklığı ≤ 0,5–1°C<\/strong> olmasıdır.<\/li><li>Türkçe kaynaklarda \"kar yağış sınırı\" veya \"kar seviyesi\" olarak da geçer.<\/li><\/ul>", "nasil": "<p>Kar taneleri bulutta oluşur ve düşerken 0°C'nin üstündeki tabakada erimeye başlar. Erime anında değil, birkaç yüz metre boyunca sürer; bu yüzden kar, donma seviyesinin altında bir süre daha kar olarak kalır. Hava kuruysa tanenin yüzeyinden buharlaşma ek soğutma sağlar; kar sınırı daha da aşağı iner.<\/p>", "ornek": "<p>Model 1200 m'de donma seviyesi gösteriyorsa Bolu şehir merkezi (725 m) yağmur, Kartalkaya (1900 m) kar, Abant (1300 m) sulu kar–kar sınırındadır. Yoğun ve uzun süreli yağışta Bolu merkeze de kar düşebilir.<\/p>", "hata": "<p>Kar sınırını donma seviyesiyle aynı sanmak. Donma seviyesinin tam altında hava +1°C'dir ama kar hâlâ yağar.<\/p>"}, "kaynaklar": ["MeteoSwiss \"Schneefallgrenze\" açıklaması — donma seviyesi −300 m kuralı", "NWS \"Snow level vs freezing level\" — 500–1000 ft (150–300 m) farkı", "Steinacker (1983), <em>Arch. Met. Geoph. Biocl.<\/em> — yoğun yağışta kar sınırının inişi"], "tutarlilik": {"seviye": "orta", "simge": "🟡", "not": "3/3 mekanizmada hemfikir, mesafede farklı", "dogrulama": "2026-09-08", "celiski": "NWS 150–300 m, MeteoSwiss 300 m, Steinacker yoğun yağışta 600 m'ye kadar verir. Kart 200–400 m'yi standart, 600 m'yi uç değer olarak sunar.", "yeniden_dogrulama": null, "seviye_adi": "Orta"}}, {"id": "daglarda-kar-yagmasi-nasil-aciklanir", "baslik": "Dağlarda Kar Yağması Nasıl Açıklanır?", "kategori": "Dikey Atmosfer", "kategori_id": "dikey-atmosfer", "seviye": "orta", "etiketler": ["irtifa", "lapse rate", "kar sınırı", "850 hPa", "dağ", "orografik"], "dosya": "02-dikey-atmosfer.md", "sira": 102, "kisa_tanim_duz": "Dağa çarpan hava yükselmeye zorlanır, yükselirken soğur, nemi yoğuşur ve yağış oluşur (orografik yükselme). Dağ hem yeterince soğuk hem de daha fazla yağışlı olduğu için kar, dağlarda hem daha sık hem daha çok yağar.", "alanlar": {"kisa_tanim": "<p>Dağa çarpan hava yükselmeye zorlanır, yükselirken soğur, nemi yoğuşur ve yağış oluşur (orografik yükselme). Dağ hem yeterince soğuk hem de daha fazla yağışlı olduğu için kar, dağlarda hem daha sık hem daha çok yağar.<\/p>", "esik": "<ul><li>Rüzgâra bakan yamaç (rüzgâr üstü): yağış artar, tipik olarak her 100 m'de %5–10<\/li><li>Rüzgâr altı yamaç: föhn etkisi, hava alçalırken 9,8°C/km ısınır ve kurur; yağış azalır (\"yağmur gölgesi\")<\/li><li>Kar için gerekli: 850 hPa sıcaklığı ≤ −2/−5°C <strong>ve<\/strong> yamaç seviyesinde ıslak termometre ≤ 0°C<\/li><\/ul>", "nasil": "<p>Nemli hava dağa yaklaştığında yatay hareketi dikey harekete dönüşür. Yükselen hava kuru adyabatik oranla soğur; çiğ noktasına ulaşınca bulut oluşur (bu yükseklik \"yoğuşma seviyesi\"dir, dağ zirvelerine takılan bulutun tabanı buradadır). Bulut içinde yükselmeye devam eden hava nemli oranla soğur ve yağış bırakır. Zirveyi aşan hava rüzgâr altı yamaçta alçalır, sıkışır, ısınır ve kurur.<\/p>", "ornek": "<p>Karadeniz'den gelen nemli kuzey rüzgârı Kaçkarlar'ın kuzey yamacına metrelerce kar bırakırken, Erzurum tarafında (rüzgâr altı) yağış çok azdır. Toroslar'ın Akdeniz'e bakan yamacı Konya Ovası'ndan 3–4 kat fazla yağış alır.<\/p>", "hata": "<p>\"Dağ soğuk olduğu için kar yağar\" demek. Soğuk gereklidir ama yeterli değildir; nem taşıyan bir rüzgâr yönü olmadan dağ ne kadar soğuk olursa olsun kar yağmaz (örnek: kış boyunca açık, kuru ve −20°C olan Ağrı).<\/p>"}, "kaynaklar": ["Roe, G.H. (2005) \"Orographic Precipitation\", <em>Annu. Rev. Earth Planet. Sci.<\/em> — mekanizma ve yamaç oranları", "Met Office \"Orographic rainfall\" — föhn ve yağmur gölgesi", "MGM Türkiye yağış atlası — Karadeniz/Toros yamaç farkları"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "kar-yagmasi-icin-hangi-irtifada-hava-kac-derece-olmali", "baslik": "Kar Yağması İçin Hangi İrtifada Hava Kaç Derece Olmalı?", "kategori": "Dikey Atmosfer", "kategori_id": "dikey-atmosfer", "seviye": "orta", "etiketler": ["irtifa", "lapse rate", "kar sınırı", "850 hPa", "dağ", "orografik"], "dosya": "02-dikey-atmosfer.md", "sira": 103, "kisa_tanim_duz": "Meteorologlar yerdeki sıcaklığa değil, yaklaşık 1500 m'deki (850 hPa) ve 3000 m'deki (700 hPa) sıcaklığa bakar. Alçak kesimlerde kar için 850 hPa'nın −3 ile −5°C'nin altına inmesi gerekir.", "alanlar": {"kisa_tanim": "<p>Meteorologlar yerdeki sıcaklığa değil, yaklaşık 1500 m'deki (850 hPa) ve 3000 m'deki (700 hPa) sıcaklığa bakar. Alçak kesimlerde kar için 850 hPa'nın −3 ile −5°C'nin altına inmesi gerekir.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>Seviye<\/th><th>Yaklaşık yükseklik<\/th><th>Kar için eşik<\/th><th>Not<\/th><\/tr><\/thead><tbody><tr><td>2 m (yüzey)<\/td><td>0 m<\/td><td>≤ +1/+2°C (ıslak termometre ≤ 0,5°C)<\/td><td>Tek başına yetersiz<\/td><\/tr><tr><td>925 hPa<\/td><td>~750 m<\/td><td>≤ −1°C<\/td><td>Kıyı şehirleri için iyi gösterge<\/td><\/tr><tr><td><strong>850 hPa<\/strong><\/td><td><strong>~1500 m<\/strong><\/td><td><strong>≤ −3°C (güvenli: ≤ −5°C)<\/strong><\/td><td>En çok kullanılan eşik<\/td><\/tr><tr><td>700 hPa<\/td><td>~3000 m<\/td><td>≤ −10°C<\/td><td>Ek kontrol<\/td><\/tr><tr><td>1000–500 hPa kalınlık<\/td><td>—<\/td><td>≤ 5280 m (\"528 çizgisi\")<\/td><td>Klasik Avrupa kuralı<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Türkiye için pratik kural: 850 hPa sıcaklığı <strong>−5°C<\/strong> olduğunda İç Anadolu'da (900–1000 m) kar; <strong>−8°C<\/strong> ve altında İstanbul, İzmir gibi kıyı şehirlerinde kar mümkündür.<\/li><li>Deniz üzerinden gelen hava (Karadeniz, Marmara) yerde 1–2°C ekstra ısınma yapar; kıyıda eşik daha sıkı tutulur.<\/li><\/ul>", "nasil": "<p>Yerdeki sıcaklık günlük döngü, deniz etkisi ve şehir ısı adasından etkilenir; 850 hPa ise bu gürültüden arınmış \"hava kütlesi\" sıcaklığını gösterir. Eğer 850 hPa −5°C ise standart oranla yer seviyesinde (0 m) yaklaşık +5°C, 1000 m'de −1,5°C beklenir; yoğun yağışta eriyen kar havayı ek soğutur ve eşik gevşer.<\/p>", "ornek": "<p>Ankara için forecast'ta 850 hPa −6°C ve yağış görülüyorsa kar kesinleşmiştir. İstanbul için 850 hPa −4°C ise Kartal, Sarıyer gibi yüksek ilçelerde kar, Kadıköy sahilde yağmur–sulu kar olur; −8°C'de tüm şehirde kar tutar.<\/p>", "hata": "<p>Sadece yer sıcaklığına bakmak. Yerde +3°C iken 850 hPa −7°C ise kar başlayınca yer sıcaklığı hızla düşer ve kar tutar; tersi durumda (yerde 0°C, 850 hPa 0°C) sulu kar ve yağmur olur.<\/p>"}, "kaynaklar": ["UK Met Office / wetterzentrale forum \"528 line\" geleneği — kalınlık kuralı", "NWS Forecaster's Guide — 850 hPa ve ıslak termometre eşikleri", "MGM tahmincileri ve Türk hava tahmin forumları (uyarı: resmî değil) — Türkiye için −5/−8°C pratik eşikleri"], "tutarlilik": {"seviye": "orta", "simge": "🟡", "not": "mekanizmada hemfikir, sayısal eşik kaynağa göre değişiyor", "dogrulama": "2026-09-08", "celiski": "850 hPa eşiği kaynaklarda −2, −3, −5 ve −6°C olarak geçer; bölgeye ve yüksekliğe bağlıdır. Kart, aralığı tablo hâlinde verir ve Türkiye için yerel pratik değerleri \"resmî olmayan\" olarak işaretler.", "yeniden_dogrulama": null, "seviye_adi": "Orta"}}, {"id": "bulut-turleri", "baslik": "Bulut Türleri", "kategori": "Yağış ve Bulutlar", "kategori_id": "yagis-ve-bulutlar", "seviye": "temel", "etiketler": ["bulut", "yağış türleri", "dolu", "virga", "cumulonimbus", "deniz etkisi", "DEK"], "dosya": "03-yagis-ve-bulutlar.md", "sira": 200, "kisa_tanim_duz": "Dünya Meteoroloji Örgütü (WMO) bulutları taban yüksekliğine göre 3 kata ve şekle göre 10 ana cinse ayırır. Bulutun türü, gelecek birkaç saatteki havayı okumanın en pratik yoludur.", "alanlar": {"kisa_tanim": "<p>Dünya Meteoroloji Örgütü (WMO) bulutları taban yüksekliğine göre 3 kata ve şekle göre 10 ana cinse ayırır. Bulutun türü, gelecek birkaç saatteki havayı okumanın en pratik yoludur.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>Kat<\/th><th>Taban yüksekliği (orta enlem)<\/th><th>Cinsler<\/th><th>İşaret<\/th><\/tr><\/thead><tbody><tr><td>Yüksek<\/td><td>5–13 km<\/td><td>Cirrus (Ci), Cirrocumulus (Cc), Cirrostratus (Cs)<\/td><td>Buz kristali; Cs → güneş/ay halesi, 12–24 saat içinde cephe<\/td><\/tr><tr><td>Orta<\/td><td>2–7 km<\/td><td>Altocumulus (Ac), Altostratus (As)<\/td><td>As kalınlaşıyorsa yağış yaklaşıyor<\/td><\/tr><tr><td>Alçak<\/td><td>0–2 km<\/td><td>Stratus (St), Stratocumulus (Sc), Nimbostratus (Ns)<\/td><td>Ns = sürekli, ılımlı yağış<\/td><\/tr><tr><td>Dikey gelişimli<\/td><td>Taban 0,5–2 km, tepe 12 km'ye kadar<\/td><td>Cumulus (Cu), Cumulonimbus (Cb)<\/td><td>Cb = sağanak, dolu, gök gürültüsü<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Bulut tabanı yaklaşık hesabı: <code>Taban (m) ≈ 125 × (T − Td)<\/code> (T: sıcaklık, Td: çiğ noktası, °C)<\/li><\/ul>", "nasil": "<p>Bulutlar, yükselen havanın çiğ noktasına soğumasıyla oluşur. Yavaş, geniş alanlı yükselme (cephe) tabaka bulutlar (stratus tipi) yapar; hızlı, yerel yükselme (güneşle ısınan yer, dağ) yığın bulutlar (cumulus tipi) yapar. \"Nimbo/nimbus\" eki yağış anlamına gelir.<\/p>", "ornek": "<p>Sabah gökyüzünde Cirrus, öğleden sonra Cirrostratus ile hale, akşam Altostratus ve ertesi sabah Nimbostratus ile yağmur — klasik ılık cephe sırasıdır. Yaz öğleden sonrası Cumulus'un hızla kuleye dönüşmesi (Cumulus congestus) 1–2 saat içinde sağanak demektir.<\/p>", "hata": "<p>Her koyu bulutu yağış bulutu sanmak. Stratocumulus koyu ve kalın görünür ama nadiren yağış verir; belirleyici olan bulutun tabanının pürüzsüz ve tabanının gri-mavimsi olması (Nimbostratus) ya da tepesinin örs şeklini alması (Cumulonimbus) gibi işaretlerdir.<\/p>"}, "kaynaklar": ["WMO International Cloud Atlas (2017) — 10 cins, kat yükseklikleri", "MGM \"Bulutlar\" eğitim sayfası — Türkçe adlandırma", "NWS JetStream \"Cloud Classification\" — taban formülü"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "yagis-sekilleri", "baslik": "Yağış Şekilleri", "kategori": "Yağış ve Bulutlar", "kategori_id": "yagis-ve-bulutlar", "seviye": "temel", "etiketler": ["bulut", "yağış türleri", "dolu", "virga", "cumulonimbus", "deniz etkisi", "DEK"], "dosya": "03-yagis-ve-bulutlar.md", "sira": 201, "kisa_tanim_duz": "Buluttan düşen su, yere kadar geçtiği tabakaların sıcaklığına göre yağmur, kar, sulu kar, buz taneleri, dondurucu yağmur, grepil veya dolu olarak ulaşır.", "alanlar": {"kisa_tanim": "<p>Buluttan düşen su, yere kadar geçtiği tabakaların sıcaklığına göre yağmur, kar, sulu kar, buz taneleri, dondurucu yağmur, grepil veya dolu olarak ulaşır.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>Tür<\/th><th>Nasıl oluşur<\/th><th>Ayırt edici işaret<\/th><\/tr><\/thead><tbody><tr><td>Yağmur<\/td><td>Çap &gt; 0,5 mm damla<\/td><td>—<\/td><\/tr><tr><td>Çisenti<\/td><td>Çap &lt; 0,5 mm, stratus'tan<\/td><td>Rüzgârda süzülür<\/td><\/tr><tr><td>Kar<\/td><td>Tüm profil ≤ 0°C (yüzey +2°C'ye kadar)<\/td><td>Altıgen kristal, tane<\/td><\/tr><tr><td>Sulu kar (karla karışık yağmur)<\/td><td>Kar kısmen erimiş<\/td><td>Yere değince su olur, tutmaz<\/td><\/tr><tr><td>Buz taneleri (ice pellets)<\/td><td>Kar erir → yere yakın tekrar donar<\/td><td>Yere düşünce zıplar, saydam, 1–3 mm<\/td><\/tr><tr><td>Dondurucu yağmur<\/td><td>Sıvı damla, yerde −0°C yüzeye değince donar<\/td><td>Ağaç, tel, yol camlaşır; en tehlikelisi<\/td><\/tr><tr><td>Grepil (yumuşak dolu)<\/td><td>Kar kristali üzerine aşırı soğumuş damlacık yapışır<\/td><td>Beyaz, opak, 2–5 mm, elle ezilir<\/td><\/tr><tr><td>Dolu<\/td><td>Cumulonimbus'ta katmanlı buz büyümesi<\/td><td>≥ 5 mm, sert, katmanlı; sadece fırtına<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Dondurucu yağmur profili: yukarıda kar → orta katta +1/+3°C ılık dil (kalın) → yerde ≤ 0°C ince soğuk tabaka<\/li><li>Buz taneleri profili: aynı ama alt soğuk tabaka kalın (&gt; 300–500 m), damla tekrar donmaya vakit bulur<\/li><\/ul>", "nasil": "<p>Yağış neredeyse her zaman bulut içinde kar/buz olarak başlar (Bergeron süreci). Yere inerken geçtiği tabakalar sıcaksa erir, tekrar soğuksa donar. Bu yüzden yağış türü tahmin etmek, dikey sıcaklık profilini okumaktır.<\/p>", "ornek": "<p>Ocak 2022 İstanbul'da yağış sabah yağmur, öğlen sulu kar, akşam kar olarak başladı; bu, 850 hPa sıcaklığının gün içinde 0°C'den −6°C'ye inmesiydi. İç Anadolu'da nadiren dondurucu yağmur görülür çünkü orta katta ılık dil oluşumu Türkiye'de nadirdir.<\/p>", "hata": "<p>Grepili dolu sanmak. Grepil kışın, kar sağanağında düşer ve elle ezilir; dolu ilkbahar–yaz fırtınalarında düşer ve serttir.<\/p>"}, "kaynaklar": ["AMS Glossary of Meteorology — tüm yağış türleri tanımı", "NWS \"Winter precipitation types\" — dikey profil şemaları", "MGM Meteoroloji Sözlüğü — Türkçe karşılıklar"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "(Türkçede \"sulu kar\" ve \"karla karışık yağmur\" aynı olay için kullanılır)", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "dolu-nasil-olusur", "baslik": "Dolu Nasıl Oluşur?", "kategori": "Yağış ve Bulutlar", "kategori_id": "yagis-ve-bulutlar", "seviye": "temel", "etiketler": ["bulut", "yağış türleri", "dolu", "virga", "cumulonimbus", "deniz etkisi", "DEK"], "dosya": "03-yagis-ve-bulutlar.md", "sira": 202, "kisa_tanim_duz": "Dolu, Cumulonimbus bulutunun güçlü yukarı akımında buz çekirdeğinin aşırı soğumuş su damlacıklarını üzerine toplaya toplaya büyümesiyle oluşur. Yukarı akım taneyi taşıyamayacak kadar zayıfladığında yere düşer.", "alanlar": {"kisa_tanim": "<p>Dolu, Cumulonimbus bulutunun güçlü yukarı akımında buz çekirdeğinin aşırı soğumuş su damlacıklarını üzerine toplaya toplaya büyümesiyle oluşur. Yukarı akım taneyi taşıyamayacak kadar zayıfladığında yere düşer.<\/p>", "esik": "<ul><li>Dolu tanesini havada tutan minimum yukarı akım hızı ≈ tanenin son hızı:<\/li><\/ul><div class=\"tablo\"><table><thead><tr><th>Dolu çapı<\/th><th>Gerekli yukarı akım<\/th><th>Yaklaşık düşme hızı<\/th><\/tr><\/thead><tbody><tr><td>1 cm (nohut)<\/td><td>~15 m/s<\/td><td>50 km/sa<\/td><\/tr><tr><td>2,5 cm (ceviz)<\/td><td>~25 m/s<\/td><td>90 km/sa<\/td><\/tr><tr><td>5 cm (yumurta)<\/td><td>~45 m/s<\/td><td>160 km/sa<\/td><\/tr><tr><td>8 cm+<\/td><td>&gt; 60 m/s<\/td><td>200+ km/sa<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Gerekli koşullar: CAPE &gt; 1000 J/kg, donma seviyesi 2,5–4 km arasında (fazla yüksekse dolu düşerken erir), rüzgâr kesmesi (shear) tanenin bulutta uzun süre dolaşmasını sağlar<\/li><li>Radar işareti: 50–55 dBZ ve üstü, özellikle −20°C seviyesinin üstünde yüksek yansıtıcılık<\/li><\/ul>", "nasil": "<p>Fırtına bulutunun 0°C'nin altındaki bölümünde su damlacıkları −20/−30°C'ye kadar sıvı kalır (aşırı soğuma). Bir buz çekirdeği bu bölgeden geçerken damlacıklar üzerine çarpıp anında donar. Tane yukarı akımla yükselir, kenardan düşer, yeniden akıma kapılır; her turda bir katman ekler (kestiğinizde soğan gibi halkalar görürsünüz). Yukarı akım sonunda taneyi tutamaz ve dolu düşer.<\/p>", "ornek": "<p>Türkiye'de dolu en çok Nisan–Haziran'da İç Anadolu ve Doğu Anadolu'da görülür; bu dönemde yer ısınırken yukarıda soğuk hava kalır (kararsızlık). 27 Temmuz 2017 İstanbul dolusu ceviz büyüklüğündeydi ve 20 dakikada binlerce aracı hasarladı.<\/p>", "hata": "<p>\"Dolu yağdı, hava soğuk demek ki\" düşüncesi. Dolu, yerde 30°C iken de yağar; soğuk bulutun tepesindedir, yerin değil.<\/p>"}, "kaynaklar": ["NSSL (NOAA Severe Storms Lab) \"Hail basics\" — yukarı akım / çap tablosu", "Knight &amp; Knight (2001), \"Hailstorms\", <em>AMS Monograph<\/em> — katmanlı büyüme", "MGM Dolu Çalışma Raporları — Türkiye dolu iklimi"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "(yukarı akım değerleri ±5 m/s oynar)", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "virga-nedir-radarda-yagis-gorunurken-yere-neden-dusmez", "baslik": "Virga Nedir? Radarda Yağış Görünürken Yere Neden Düşmez?", "kategori": "Yağış ve Bulutlar", "kategori_id": "yagis-ve-bulutlar", "seviye": "temel", "etiketler": ["bulut", "yağış türleri", "dolu", "virga", "cumulonimbus", "deniz etkisi", "DEK"], "dosya": "03-yagis-ve-bulutlar.md", "sira": 203, "kisa_tanim_duz": "Virga, buluttan düşen ama yere ulaşmadan buharlaşan ya da süblimleşen yağıştır. Radar buluttaki damlaları görür, bu yüzden radarda yağış varken yer kuru kalabilir.", "alanlar": {"kisa_tanim": "<p>Virga, buluttan düşen ama yere ulaşmadan buharlaşan ya da süblimleşen yağıştır. Radar buluttaki damlaları görür, bu yüzden radarda yağış varken yer kuru kalabilir.<\/p>", "esik": "<ul><li>Virga riski yüksek: yer seviyesinde bağıl nem &lt; %40 ve çiğ noktası farkı (T − Td) &gt; 10°C<\/li><li>Radar demeti yükseklik kuralı: radar merkezinden 100 km uzakta demet yerden ~1 km, 200 km'de ~3 km yukarıdadır (0,5° elevasyon, dünya eğriliği dahil). Bu yükseklikteki yağış yere kadar inmeyebilir.<\/li><li>Yağış yere ulaşmadan önce alt havayı soğutur ve nemlendirir; 30–60 dakika içinde virga gerçek yağışa dönüşebilir.<\/li><\/ul>", "nasil": "<p>Damlalar veya kar taneleri bulut tabanından çıkıp kuru havaya girince buharlaşır. Buharlaşma havayı soğutur (bu yüzden virga altında ani soğuk rüzgâr, hatta \"kuru mikroburst\" olabilir). Radar, yağışın hangi yükseklikte olduğunu kendisi bilmez; uzaktaki hedeflerde demet yükselir ve yalnızca bulut içindeki yağışı görür. Ayrıca bazı radar görüntüleri (özellikle \"composite\" ürünler) tüm yükseklik katmanlarının en yüksek değerini gösterir; bu, yer seviyesindeki yağış değildir.<\/p>", "ornek": "<p>Ankara'da yaz öğleden sonraları radar üzerinde sarı-turuncu hücreler geçerken yere birkaç damla düşer; çünkü yerde nem %20'dir. Görsel işaret: bulut tabanından aşağı sarkan, yere ulaşmadan kaybolan gri saçaklar.<\/p>", "hata": "<p>\"Radar yalan söylüyor\" demek. Radar doğru ölçer; yanlış olan, radar ürününün yer seviyesi yağışı gösterdiği varsayımıdır. Yer sensörleri (yağış ölçer) ile radarı birlikte okumak gerekir.<\/p>"}, "kaynaklar": ["AMS Glossary — virga tanımı", "NWS Radar FAQ \"Why does radar show rain but it's not raining?\" — demet yüksekliği, buharlaşma, yanlış yankılar", "Doviak &amp; Zrnić, <em>Doppler Radar and Weather Observations<\/em> — demet yüksekliği formülü"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "deniz-etkisi-kari-dek-nedir", "baslik": "Deniz Etkisi Karı (DEK) Nedir?", "kategori": "Yağış ve Bulutlar", "kategori_id": "yagis-ve-bulutlar", "seviye": "temel", "etiketler": ["bulut", "yağış türleri", "dolu", "virga", "cumulonimbus", "deniz etkisi", "DEK"], "dosya": "03-yagis-ve-bulutlar.md", "sira": 204, "kisa_tanim_duz": "Soğuk ve kuru bir hava kütlesinin, kendisinden çok daha ılık bir deniz yüzeyi üzerinden uzun mesafe geçerken nem ve ısı kazanıp kıyıda dar ve yoğun kar bantları bırakmasıdır. Kuzey Amerika'da \"göl etkisi karı\" (lake-effect snow) olarak bilinir; İstanbul'un büyük kar fırtınalarının çoğu Karadeniz kaynaklı deniz etkisi karıdır.", "alanlar": {"kisa_tanim": "<p>Soğuk ve kuru bir hava kütlesinin, kendisinden çok daha ılık bir deniz yüzeyi üzerinden uzun mesafe geçerken nem ve ısı kazanıp kıyıda dar ve yoğun kar bantları bırakmasıdır. Kuzey Amerika'da \"göl etkisi karı\" (lake-effect snow) olarak bilinir; İstanbul'un büyük kar fırtınalarının çoğu Karadeniz kaynaklı deniz etkisi karıdır.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>Koşul<\/th><th>Eşik<\/th><th>Not<\/th><\/tr><\/thead><tbody><tr><td>Deniz yüzeyi − 850 hPa sıcaklık farkı<\/td><td>≥ 13°C<\/td><td>Temel kararsızlık ölçütü; Karadeniz kışın 8–10°C, 850 hPa ≤ −5°C<\/td><\/tr><tr><td>Deniz üzerindeki yol (fetch)<\/td><td>≥ 80–100 km<\/td><td>Yol uzadıkça alınan nem ve ısı artar<\/td><\/tr><tr><td>Rüzgâr yönü değişimi (yüzey–700 hPa)<\/td><td>&lt; 30°<\/td><td>Bantlar düzenli ve sabit kalır; &gt; 60° bantlar dağılır<\/td><\/tr><tr><td>Kararsız tabaka kalınlığı (inversiyon tabanı)<\/td><td>≥ 1,5–3 km<\/td><td>Sığ tabaka → hafif kar; kalın tabaka → şiddetli bant<\/td><\/tr><tr><td>850 hPa rüzgâr hızı<\/td><td>20–50 km/sa<\/td><td>Çok zayıf → bant denizde kalır; çok kuvvetli → nem toplanamaz<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Tek bantta 2–5 cm/sa kar mümkündür; bandın 20–30 km dışında hiç yağış olmayabilir.<\/li><li>İstanbul için pratik kural (resmî değil): 850 hPa ≤ −8°C, kuzey/kuzey-kuzeydoğu rüzgârı ≥ 12 saat sürüyor ve Karadeniz yüzeyi ~8°C → DEK bantları beklenir.<\/li><\/ul>", "nasil": "<p>Sibirya veya Balkanlar kökenli soğuk hava Karadeniz'in nispeten ılık yüzeyine gelince alt tabaka hızla ısınır ve nemlenir; büyük dikey sıcaklık farkı hava kolonunu kararsız yapar. Isınan hava yükselir, rüzgâr yönünde uzanan düzenli konvektif bulut sıraları (bantlar) oluşur. Bantlar kıyıya ulaşınca sürtünme ve yükselti ek kaldırma sağlar; yağış kıyı şeridine ve rüzgâr yönündeki ilk 30–80 km'ye yoğunlaşır. Yağış yerel ve şeritlidir: komşu ilçeler arasında kar kalınlığı farkı 30–40 cm olabilir.<\/p>", "ornek": "<p>Şubat 2015 ve Ocak 2017'de kuzey rüzgârıyla Karadeniz'den gelen bantlar Sarıyer, Beykoz ve Şile'de yarım metreyi aşan kar bırakırken aynı saatlerde Silivri ve Avcılar'da birkaç santimetre vardı. Radar mozaiğinde Karadeniz'den kıyıya uzanan paralel şeritler DEK'in imzasıdır. Dünyada en yoğun örnekler ABD Büyük Göller (Buffalo) ve Japonya'nın Japon Denizi kıyısıdır (Niigata).<\/p>", "hata": "<p>DEK'i cephe karıyla karıştırmak. Cephe karı geniş alana eşit yağar; DEK bantlarında bir ilçede tipi varken 20 km ötede güneş açabilir. \"Tahmin 5 cm dedi, 40 cm yağdı\" şikâyetlerinin çoğu bandın konumundaki 20–30 km'lik kaymadan gelir; 9 km çözünürlüklü küresel modeller bant konumunu güvenilir çözemez, 2 km altı modellere ve radara bakın.<\/p>"}, "kaynaklar": ["NWS Buffalo \"Lake Effect Snow\" eğitim sayfası — 13°C fark, rüzgâr kesmesi ve fetch eşikleri", "Niziol, Snyder &amp; Waldstreicher (1995), <em>Wea. Forecasting<\/em> — Büyük Göller DEK tahmin ölçütleri", "AMS Glossary of Meteorology — \"lake-effect snow\" tanımı", "MGM ve üniversite vaka analizleri (İstanbul Şubat 2015, Ocak 2017 kar olayları) — Karadeniz için 850 hPa −8°C pratik eşiği (resmî olmayan)"], "tutarlilik": {"seviye": "orta", "simge": "🟡", "not": "4/4 mekanizmada hemfikir; sayısal eşikler kaynağa göre değişiyor", "dogrulama": "2026-09-10", "celiski": "13°C sıcaklık farkı tüm kaynaklarda ortak; fetch eşiği 80, 100 ve 160 km olarak geçer, rüzgâr kesmesi eşiği 30° ile 60° arasında değişir. Karadeniz için −8°C değeri Türk tahmin forumlarının pratiğidir, resmî bir eşik değildir.", "yeniden_dogrulama": null, "seviye_adi": "Orta"}}, {"id": "radar-goruntusu-nasil-okunur", "baslik": "Radar Görüntüsü Nasıl Okunur?", "kategori": "Radar ve Modeller", "kategori_id": "radar-ve-modeller", "seviye": "orta", "etiketler": ["radar", "dBZ", "GFS", "ECMWF", "ICON", "ensemble", "Windy"], "dosya": "04-radar-ve-modeller.md", "sira": 300, "kisa_tanim_duz": "Hava radarı bir mikrodalga sinyal gönderir ve yağış taneciklerinden geri yansıyan gücü ölçer. Bu güç \"yansıtıcılık\" (dBZ) olarak renklendirilir; renk yağışın türünü değil şiddetini gösterir.", "alanlar": {"kisa_tanim": "<p>Hava radarı bir mikrodalga sinyal gönderir ve yağış taneciklerinden geri yansıyan gücü ölçer. Bu güç \"yansıtıcılık\" (dBZ) olarak renklendirilir; renk yağışın türünü değil şiddetini gösterir.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>dBZ<\/th><th>Renk (yaygın palet)<\/th><th>Anlamı<\/th><th>Yaklaşık yağış şiddeti<\/th><\/tr><\/thead><tbody><tr><td>&lt; 15<\/td><td>Açık mavi / gri<\/td><td>Çisenti, bulut, kuş, böcek<\/td><td>&lt; 0,3 mm/sa<\/td><\/tr><tr><td>15–30<\/td><td>Mavi–yeşil<\/td><td>Hafif yağmur, kar<\/td><td>0,3–3 mm/sa<\/td><\/tr><tr><td>30–40<\/td><td>Yeşil–sarı<\/td><td>Orta yağmur<\/td><td>3–12 mm/sa<\/td><\/tr><tr><td>40–50<\/td><td>Sarı–turuncu<\/td><td>Kuvvetli sağanak<\/td><td>12–50 mm/sa<\/td><\/tr><tr><td>50–60<\/td><td>Kırmızı<\/td><td>Şiddetli sağanak, küçük dolu olası<\/td><td>50–100 mm/sa<\/td><\/tr><tr><td>&gt; 60<\/td><td>Mor / beyaz<\/td><td>Büyük dolu neredeyse kesin<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Kar için değerler 5–10 dBZ daha düşük okunur (kar zayıf yansıtır; 25 dBZ kar zaten yoğundur).<\/li><li><strong>Parlak bant (bright band):<\/strong> Erime seviyesinde eriyen kar, ıslak yüzeyi nedeniyle aşırı yansıtır; radarda halka şeklinde sahte \"kuvvetli yağış\" şeridi görülür.<\/li><li><strong>Yer yankısı (ground clutter):<\/strong> Radar çevresindeki dağlar ve binalar sabit lekeler yapar.<\/li><li><strong>Anormal yayılım:<\/strong> İnversiyon gecelerinde demet yere kırılır, olmayan \"yağış\" görünür (özellikle sakin, açık gecelerde).<\/li><li>Demet yüksekliği: 100 km'de ~1 km, 200 km'de ~3 km, 250 km'de ~4,5 km üstünden bakar.<\/li><\/ul>", "nasil": "<p>Radar 360° tarar, her turda anteni biraz kaldırır (0,5°, 1,5°, 2,5° …). En düşük açı yere en yakın yağışı gösterir. Yansıyan güç tanecik çapının 6. kuvvetiyle orantılıdır; bu yüzden birkaç iri dolu tanesi binlerce küçük damladan daha parlak görünür. Doppler modunda ayrıca taneciklerin radara yaklaşma/uzaklaşma hızı ölçülür (rüzgâr, dönme).<\/p>", "ornek": "<p>MGM radar mozaiğinde Ankara üzerine gelen 45–50 dBZ'lik hücre: 20–30 dakika içinde kuvvetli sağanak, muhtemelen küçük dolu. Aynı hücrenin 60 dBZ'ye çıkması ve tepeden \"üç gövde saçılımı\" (three-body scatter spike) görünmesi iri dolu işaretidir.<\/p>", "hata": "<p>Radarda kırmızı görüp \"sel geliyor\" demek. 50 dBZ, dakikalar süren bir sağanak da olabilir; süre ve hücrenin hareket hızı belirleyicidir. Ayrıca radarın 200 km ötesindeki zayıf yağış (kış karı gibi) demetin altında kaldığı için hiç görünmeyebilir.<\/p>"}, "kaynaklar": ["NWS Radar Reflectivity FAQ — dBZ tablosu ve yankı türleri", "MGM Radar Ürünleri sayfası — Türkiye radar ağı ve palet", "Rinehart, <em>Radar for Meteorologists<\/em> — Z–R ilişkisi (Marshall–Palmer)"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "(dBZ→mm/sa dönüşümü yağış tipine göre 2 kata kadar değişir; aralık verildi)", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "hava-durumu-modelleri-nedir", "baslik": "Hava Durumu Modelleri Nedir?", "kategori": "Radar ve Modeller", "kategori_id": "radar-ve-modeller", "seviye": "orta", "etiketler": ["radar", "dBZ", "GFS", "ECMWF", "ICON", "ensemble", "Windy"], "dosya": "04-radar-ve-modeller.md", "sira": 301, "kisa_tanim_duz": "Sayısal hava tahmin modeli, atmosferi bir grid'e böler ve fizik denklemlerini (hareket, termodinamik, nem) ileri doğru çözerek gelecek saatler ve günler için tahmin üretir. Farklı kurumların modelleri farklı çözünürlük, fizik ve başlangıç verisi kullanır; bu yüzden aynı gün için farklı sonuç verirler.", "alanlar": {"kisa_tanim": "<p>Sayısal hava tahmin modeli, atmosferi bir grid'e böler ve fizik denklemlerini (hareket, termodinamik, nem) ileri doğru çözerek gelecek saatler ve günler için tahmin üretir. Farklı kurumların modelleri farklı çözünürlük, fizik ve başlangıç verisi kullanır; bu yüzden aynı gün için farklı sonuç verirler.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>Model<\/th><th>Kurum<\/th><th>Çözünürlük<\/th><th>Ufuk<\/th><th>Güncelleme<\/th><th>Güçlü yanı<\/th><\/tr><\/thead><tbody><tr><td><strong>ECMWF IFS (HRES)<\/strong><\/td><td>Avrupa (ECMWF)<\/td><td>~9 km<\/td><td>10–15 gün<\/td><td>4×/gün<\/td><td>3–10 gün arası genel doğrulukta lider<\/td><\/tr><tr><td><strong>GFS<\/strong><\/td><td>ABD (NOAA)<\/td><td>~13 km<\/td><td>16 gün<\/td><td>4×/gün<\/td><td>Ücretsiz, açık, en yaygın<\/td><\/tr><tr><td><strong>ICON<\/strong><\/td><td>Almanya (DWD)<\/td><td>13 km (global), ICON-EU 6,5 km, ICON-D2 2,2 km<\/td><td>7,5 gün / 5 gün / 2 gün<\/td><td>4×–8×/gün<\/td><td>Avrupa ve Türkiye batısı için iyi detay<\/td><\/tr><tr><td><strong>UKMO (UM)<\/strong><\/td><td>İngiltere (Met Office)<\/td><td>~10 km<\/td><td>7 gün<\/td><td>4×/gün<\/td><td>Fırtına takibi<\/td><\/tr><tr><td><strong>AROME / HARMONIE<\/strong><\/td><td>Fransa / İskandinavya<\/td><td>1,3–2,5 km<\/td><td>2 gün<\/td><td>Saatlik–8×/gün<\/td><td>Kısa vadeli sağanak, dağ etkisi<\/td><\/tr><tr><td><strong>HRRR<\/strong><\/td><td>ABD<\/td><td>3 km<\/td><td>18–48 saat<\/td><td>Saatlik<\/td><td>Yalnız ABD<\/td><\/tr><tr><td><strong>WRF (MGM)<\/strong><\/td><td>Türkiye (MGM)<\/td><td>4 km<\/td><td>3 gün<\/td><td>2×–4×/gün<\/td><td>MGM'nin kendi yüksek çözünürlüklü tahmini<\/td><\/tr><tr><td><strong>Ensemble (ENS, GEFS)<\/strong><\/td><td>ECMWF, NOAA<\/td><td>Daha kaba, 30–51 üye<\/td><td>15–45 gün<\/td><td>2×–4×/gün<\/td><td>Belirsizliği ölçer<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>Çözünürlük:<\/strong> Grid aralığı; 9 km'lik model Uludağ'ı tek bir kutu olarak görür, dağın kar sınırını ayırt edemez. 2 km altı modeller (\"konvektif izinli\") sağanak hücrelerini tek tek çözer.<\/li><li><strong>Ensemble:<\/strong> Aynı model, başlangıç koşulları biraz oynatılarak 30–50 kez çalıştırılır. Üyeler hemfikirse tahmin güvenilir, dağılıyorsa belirsiz. 5 gün ötesi için tek modele değil ensemble ortalamasına ve yayılımına bakın.<\/li><li>Pratik doğruluk: 1–3 gün yüksek, 4–7 gün orta, 7–10 gün yalnızca eğilim, 10+ gün klimatoloji seviyesine yakın.<\/li><\/ul>", "nasil": "<p>Model, tüm dünyadan gelen gözlemleri (uydu, radyosonde, uçak, istasyon) alır ve \"veri özümseme\" ile en tutarlı başlangıç durumunu kurar. Ardından Navier–Stokes, termodinamik ve sürekli denklemleri dakikalık adımlarla ileri çözer. Grid'den küçük süreçler (bulut, türbülans, yağış) \"parametrizasyon\" ile yaklaşık temsil edilir; modellerin en çok ayrıştığı yer burasıdır.<\/p>", "ornek": "<p>Kış fırtınası 6 gün ötede: ECMWF Marmara'ya kar, GFS yağmur veriyor. Doğru yaklaşım: ECMWF ensemble'ının 51 üyesinin kaçının kar verdiğine bakmak. %70 üye kar diyorsa kar olasılığı yüksek, %30 ise \"izle\" demektir.<\/p>", "hata": "<p>Tek bir model çalışmasının 10 gün sonrası için verdiği kar haritasını haber yapmak. Model her 6 saatte değişir; 10 gün ötede tek çalışma neredeyse rastgeledir.<\/p>"}, "kaynaklar": ["ECMWF \"Forecast user guide\" — IFS özellikleri ve ensemble yorumu", "NOAA NCEP \"GFS/GEFS documentation\" — GFS özellikleri", "DWD \"ICON model description\" — ICON çözünürlükleri", "MGM \"Sayısal Hava Tahmini\" sayfası — WRF ayarları"], "tutarlilik": {"seviye": "orta", "simge": "🟡", "not": "4/4 tanımda hemfikir; çözünürlük ve güncelleme sıklıkları zamanla değişiyor", "dogrulama": "2026-09-08", "celiski": "Model çözünürlükleri yıl içinde güncellenebilir (örn. GFS 13 km'den daha ince gride geçiş planları). Tablo, doğrulama tarihindeki durumu yansıtır; <strong>bu kart 6 ayda bir yeniden doğrulanmalıdır.<\/strong>", "yeniden_dogrulama": "2027-03-07", "seviye_adi": "Orta", "yeniden_dogrulama_ay": 6}}, {"id": "modellere-erisim-saglayan-web-siteleri", "baslik": "Modellere Erişim Sağlayan Web Siteleri", "kategori": "Radar ve Modeller", "kategori_id": "radar-ve-modeller", "seviye": "orta", "etiketler": ["radar", "dBZ", "GFS", "ECMWF", "ICON", "ensemble", "Windy"], "dosya": "04-radar-ve-modeller.md", "sira": 302, "kisa_tanim_duz": "Ham model çıktıları büyük dosyalardır; aşağıdaki siteler bunları harita, meteogram ve grafik hâlinde ücretsiz sunar. Her sitenin gösterdiği model listesi ve gecikmesi farklıdır.", "alanlar": {"kisa_tanim": "<p>Ham model çıktıları büyük dosyalardır; aşağıdaki siteler bunları harita, meteogram ve grafik hâlinde ücretsiz sunar. Her sitenin gösterdiği model listesi ve gecikmesi farklıdır.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>Site<\/th><th>Modeller<\/th><th>Güçlü yanı<\/th><th>Not<\/th><\/tr><\/thead><tbody><tr><td><strong>Windy.com<\/strong><\/td><td>ECMWF, GFS, ICON, ICON-EU, ICON-D2, AROME, UKMO, NAM<\/td><td>Modelleri tek tıkla karşılaştırma, 850 hPa sıcaklık, donma seviyesi, radar katmanı<\/td><td>En pratik başlangıç; ücretsiz sürüm 3 saatlik adım<\/td><\/tr><tr><td><strong>Meteoblue.com<\/strong><\/td><td>Kendi NEMS modelleri + ECMWF, GFS, ICON<\/td><td>\"Multimodel\" karşılaştırma tablosu, hava kalitesi<\/td><td>Tahmin güvenilirlik göstergesi (predictability) var<\/td><\/tr><tr><td><strong>Ventusky.com<\/strong><\/td><td>GFS, ICON, ECMWF, HRRR<\/td><td>Kar yüksekliği, dalga, akıcı animasyon<\/td><td>Görsel olarak en anlaşılır<\/td><\/tr><tr><td><strong>Wetterzentrale.de<\/strong><\/td><td>ECMWF, GFS, ICON, UKMO, GEM, ensemble<\/td><td>Klasik 850 hPa ve 500 hPa haritaları, ensemble \"spagetti\" grafikleri<\/td><td>Tahminciler tarafından en çok kullanılan; arayüz eski<\/td><\/tr><tr><td><strong>Tropicaltidbits.com<\/strong><\/td><td>GFS, ECMWF, ICON, CMC, ensembles<\/td><td>Her parametre için haritalar, sondaj (skew-T)<\/td><td>İngilizce, ileri seviye<\/td><\/tr><tr><td><strong>Pivotalweather.com<\/strong><\/td><td>GFS, ECMWF, HRRR, NAM ve daha fazlası<\/td><td>Yüksek kaliteli haritalar, yağış tipi ürünleri<\/td><td>Bazı ürünler ücretli<\/td><\/tr><tr><td><strong>Open-Meteo.com<\/strong><\/td><td>ECMWF, GFS, ICON, MeteoFrance, JMA ve daha fazlası<\/td><td><strong>Ücretsiz API<\/strong>, saatlik JSON, geçmiş veri<\/td><td>Kendi sitenize veri çekmek için ideal<\/td><\/tr><tr><td><strong>ECMWF Open Charts<\/strong> (charts.ecmwf.int)<\/td><td>ECMWF HRES, ENS<\/td><td>Resmî ECMWF haritaları, ensemble meteogram<\/td><td>2022'den beri ücretsiz<\/td><\/tr><tr><td><strong>MGM (mgm.gov.tr)<\/strong><\/td><td>MGM WRF, ECMWF (yorumlanmış)<\/td><td>Türkiye il/ilçe resmî tahmin, radar, uyarılar<\/td><td>Resmî uyarılar yalnız buradan<\/td><\/tr><tr><td><strong>Windguru.cz<\/strong><\/td><td>GFS, ICON, AROME, HARMONIE<\/td><td>Rüzgâr odaklı tablo, sörf/yelken için<\/td><td>Tablo formatı sayısal karşılaştırmaya uygun<\/td><\/tr><tr><td><strong>Meteociel.fr<\/strong><\/td><td>ARPEGE, AROME, GFS, ECMWF<\/td><td>Avrupa'nın en detaylı model arşivi<\/td><td>Fransızca<\/td><\/tr><\/tbody><\/table><\/div>", "nasil": "<p>Kurumlar (NOAA, DWD, ECMWF) model çıktısını GRIB formatında açık olarak yayınlar; bu siteler dosyaları indirip görselleştirir. ECMWF 2022'den itibaren tam açık veriye geçmiştir. Gecikme genellikle model çalışmasının bitiminden 1–3 saat sonradır.<\/p>", "ornek": "<p>Hafta sonu Kartalkaya'ya kayak planı: Windy'de \"ICON-D2\" seç, 850 hPa sıcaklığına ve \"Kar yağışı\" katmanına bak; ardından wetterzentrale'de ECMWF ensemble Bolu meteogramını aç, üyelerin dağılımına bak. İkisi uyuşuyorsa git.<\/p>", "hata": "<p>Bir sitenin \"hava durumu\" ekranını kurumun resmî tahmini sanmak. Windy'nin gösterdiği doğrudan model çıktısıdır; tahminci yorumu yoktur. Resmî uyarı için MGM'ye bakın.<\/p>"}, "kaynaklar": ["Her sitenin kendi \"About / Models\" sayfası — model listeleri", "ECMWF \"Open data\" duyurusu (2022) — açık veri politikası", "Open-Meteo API dokümantasyonu — desteklenen modeller"], "tutarlilik": {"seviye": "orta", "simge": "🟡", "not": "site listeleri güncel; model listeleri değişken", "dogrulama": "2026-09-08", "celiski": "Sitelerin sunduğu modeller sık değişir; <strong>bu kart 3 ayda bir yeniden doğrulanmalıdır.<\/strong> Ücretli/ücretsiz durumu da değişebilir.", "yeniden_dogrulama": "2026-12-07", "seviye_adi": "Orta", "yeniden_dogrulama_ay": 3}}, {"id": "arac-caminda-buz-olusma-siniri-nedir", "baslik": "Araç Camında Buz Oluşma Sınırı Nedir?", "kategori": "Uygulamalı", "kategori_id": "uygulamali", "seviye": "temel", "etiketler": ["araç", "buzlanma", "don", "sürücü", "dağcılık", "kara buz"], "dosya": "05-uygulamali.md", "sira": 400, "kisa_tanim_duz": "Araç camında kırağı (buz), hava sıcaklığı 0°C'nin üstünde olsa bile oluşabilir; çünkü açık ve sakin gecelerde cam yüzeyi ışınımla soğuyarak havadan 2–5°C daha soğuk olur. Pratik eşik: hava sıcaklığı **+3/+4°C'nin altına** düşüyorsa ve gökyüzü açıksa camda buz bekleyin.", "alanlar": {"kisa_tanim": "<p>Araç camında kırağı (buz), hava sıcaklığı 0°C'nin üstünde olsa bile oluşabilir; çünkü açık ve sakin gecelerde cam yüzeyi ışınımla soğuyarak havadan 2–5°C daha soğuk olur. Pratik eşik: hava sıcaklığı <strong>+3/+4°C'nin altına<\/strong> düşüyorsa ve gökyüzü açıksa camda buz bekleyin.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>Koşul<\/th><th>Camda buz?<\/th><\/tr><\/thead><tbody><tr><td>Hava ≤ 0°C, çiğ noktası ≤ 0°C<\/td><td>Kesin (kırağı)<\/td><\/tr><tr><td>Hava +1/+4°C, açık gök, rüzgâr &lt; 10 km/sa, çiğ noktası ≤ +1°C<\/td><td>Çok olası (cam havadan soğuk)<\/td><\/tr><tr><td>Hava +1/+4°C, bulutlu ya da rüzgârlı<\/td><td>Nadiren<\/td><\/tr><tr><td>Hava &gt; +5°C<\/td><td>Pratik olarak hayır<\/td><\/tr><tr><td>Hava ≤ 0°C ama çiğ noktası çok düşük (kuru hava)<\/td><td>Buz yok, sadece soğuk cam<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Cam yüzeyi sıcaklığı ≈ Hava sıcaklığı − (2 ila 5°C) [açık, sakin gece]<\/li><li>Buz, cam yüzeyi ≤ 0°C <strong>ve<\/strong> cam yüzeyi ≤ havanın kırağı noktası (frost point) iken oluşur.<\/li><li>Kırağı noktası, 0°C altındaki çiğ noktasının buz üzerindeki karşılığıdır; çiğ noktasından 0,5–1°C daha yüksektir.<\/li><\/ul>", "nasil": "<p>Gece, tüm yüzeyler kızılötesi ışınım yayarak soğur. Bulutlar bu ışınımı geri yansıtır; açık gökyüzünde ise ışınım uzaya kaçar ve cam hızla soğur. Cam, üstü açık ve ince olduğu için özellikle hızlı soğur (ön cam eğik olduğu için arkaya göre daha çok gökyüzü \"görür\" ve daha çok buzlanır). Havadaki su buharı, soğuk cam yüzeyinde doğrudan buz kristali olarak çöker (süblimleşme). Rüzgâr, camı hava sıcaklığına yaklaştırır ve buzu engeller.<\/p>", "ornek": "<p>Ankara'da Ekim sonu, akşam 8°C, tahmin gece +2°C, gök açık: sabah ön cam buzlu olur. Aynı +2°C bulutlu bir gecede cam yalnızca çiğli kalır. Otoparkta üstü kapalı (gökyüzünü görmeyen) araçlarda buz oluşmaz.<\/p>", "hata": "<p>Hava +2°C olduğu için \"buz olmaz\" demek. Sürücüler için asıl tehlike <strong>kara buz<\/strong> (black ice): köprüler ve viyadükler altlarından da soğuduğu için yol yüzeyinde +3°C'de bile buz tutabilir; MGM \"buzlanma uyarısı\" genellikle +3°C eşiğini kullanır.<\/p>"}, "kaynaklar": ["Met Office \"Why does frost form when temperature is above freezing?\" — yüzey ışınım soğuması, +4°C eşiği", "NWS Frost / Freeze Glossary — kırağı noktası tanımı", "Karayolları / MGM kış yol uyarı kriterleri — +3°C buzlanma eşiği"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "(üst eşik Met Office'te +4°C, bazı kaynaklarda +3°C; aralık verildi)", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "surucu-icin-60-saniyelik-hava-okuma-kurallari", "baslik": "Sürücü İçin 60 Saniyelik Hava Okuma Kuralları", "kategori": "Uygulamalı", "kategori_id": "uygulamali", "seviye": "temel", "etiketler": ["araç", "buzlanma", "don", "sürücü", "dağcılık", "kara buz"], "dosya": "05-uygulamali.md", "sira": 401, "kisa_tanim_duz": "Yola çıkmadan önce üç değere bakın: sıcaklık, çiğ noktası ve gökyüzü. Bu üçlü, buzlanma, sis ve görüş sorununu %90 tahmin eder.", "alanlar": {"kisa_tanim": "<p>Yola çıkmadan önce üç değere bakın: sıcaklık, çiğ noktası ve gökyüzü. Bu üçlü, buzlanma, sis ve görüş sorununu %90 tahmin eder.<\/p>", "esik": "<ul><li><strong>Sis:<\/strong> T − Td ≤ 2°C ve rüzgâr &lt; 10 km/sa → yoğun sis riski (özellikle vadi, göl ve nehir kenarı, gece yarısı–sabah 9 arası)<\/li><li><strong>Buzlanma:<\/strong> T ≤ +3°C ve yol ıslak → kara buz riski (köprüler önce buzlanır)<\/li><li><strong>Dondurucu yağmur:<\/strong> Yağmur yağıyor ve T ≤ 0°C → en tehlikeli koşul, yola çıkmayın<\/li><li><strong>Hidroplaning (su kayması):<\/strong> Radar 40+ dBZ hücre yola geliyor → hız ≤ 80 km/sa<\/li><li><strong>Görüş:<\/strong> Kar yağarken rüzgâr &gt; 40 km/sa → tipi, görüş &lt; 200 m<\/li><\/ul>", "nasil": "<p>Sis, havanın çiğ noktasına kadar soğumasıdır; sıcaklık ve çiğ noktası birbirine yaklaşıyorsa sis kaçınılmazdır. Yol yüzeyi hava sıcaklığından farklı davranır: köprü altından ve üstünden soğur, gölgeli virajlar güneş görmez, tünel çıkışları ani yüzey değişimidir.<\/p>", "ornek": "<p>Bolu Dağı geçişi, Kasım sabahı: Düzce'de 6°C ve yağmur; dağ tünel çıkışı 1000 m'de ~0°C, yol ıslak → kara buz. TEM'de Sapanca Gölü kenarı, sonbahar sabahları T − Td = 1°C → sis.<\/p>", "hata": "<p>Aracın dış sıcaklık sensörüne güvenmek. Sensör motor ısısından ve yoldan yansıyan ısıdan etkilenir, hareket hâlinde 1–2°C yüksek gösterebilir. Çoğu araç bu yüzden +3°C'de kar tanesi uyarısı verir.<\/p>"}, "kaynaklar": ["NWS \"Fog forecasting\" — T − Td eşiği", "Karayolları Genel Müdürlüğü kış sürüş rehberi — buzlanma ve köprü uyarıları", "AAA / ADAC kış sürüş güvenliği raporları — dondurucu yağmur, hidroplaning"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "dagci-ve-kayakci-icin-model-okuma-kurallari", "baslik": "Dağcı ve Kayakçı İçin Model Okuma Kuralları", "kategori": "Uygulamalı", "kategori_id": "uygulamali", "seviye": "temel", "etiketler": ["araç", "buzlanma", "don", "sürücü", "dağcılık", "kara buz"], "dosya": "05-uygulamali.md", "sira": 402, "kisa_tanim_duz": "Dağda hava, ovadan farklı okunur: yükseklik seviyesindeki sıcaklığa, rüzgâra ve donma seviyesine bakılır. Yer istasyonu verisi dağ için yanıltıcıdır.", "alanlar": {"kisa_tanim": "<p>Dağda hava, ovadan farklı okunur: yükseklik seviyesindeki sıcaklığa, rüzgâra ve donma seviyesine bakılır. Yer istasyonu verisi dağ için yanıltıcıdır.<\/p>", "esik": "<ul><li>Zirve sıcaklığı ≈ 850 hPa (1500 m) veya 700 hPa (3000 m) sıcaklığı — en yakın seviyeyi alın<\/li><li>Hissedilen sıcaklık: zirve sıcaklığı + rüzgâr soğutma; 40 km/sa rüzgâr −5°C'yi −13°C yapar<\/li><li><strong>Donma seviyesi<\/strong> kar/yağmur sınırını, <strong>CAPE<\/strong> öğleden sonra fırtına riskini, <strong>700 hPa rüzgârı<\/strong> zirvede rüzgârı verir<\/li><li>Kar sınırı için 2 km altı model (ICON-D2, AROME) kullanın; 9 km model dağı görmez<\/li><li>Çığ riski için yalnızca resmî çığ bülteni (MGM / AFAD) kullanın; model bu bilgiyi vermez<\/li><\/ul>", "nasil": "<p>Dağ, serbest atmosferin içinde bir \"ada\"dır; zirve havası çoğunlukla yerden değil, çevresindeki yükseklik seviyesindeki havadan gelir. Bu yüzden 850/700 hPa haritaları dağ için yer haritalarından daha doğrudur. Yaz öğleden sonralarında güneşle ısınan yamaçlar konvektif yükselmeyi tetikler; dağda fırtına genellikle 13:00–17:00 arasında çıkar.<\/p>", "ornek": "<p>Erciyes zirvesi (3917 m) için 700 hPa sıcaklığı −12°C ve rüzgâr 60 km/sa: hissedilen −26°C, 15 dakikada donma riski. Aynı gün Kayseri'de yerde +5°C.<\/p>", "hata": "<p>Kayseri veya Bursa tahminine bakıp dağa çıkmak. Şehir tahmini 1000 m'deki koşulu gösterir; zirve 2500 m yukarıdadır.<\/p>"}, "kaynaklar": ["Mountain-Forecast.com metodolojisi — yükseklik seviyesi tahmini", "Meteoswiss \"Alpine weather\" rehberi — dağ konveksiyonu saatleri", "Türkiye Dağcılık Federasyonu / AFAD çığ bülteni açıklamaları"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}, {"id": "acik-sensor-aglari-ve-ucretsiz-api-ler", "baslik": "Açık Sensör Ağları ve Ücretsiz API'ler", "kategori": "Açık Veri ve Sensörler", "kategori_id": "acik-veri-ve-sensorler", "seviye": "ileri", "etiketler": ["API", "sensör", "ESP32", "Netatmo", "open-meteo", "MQTT", "harita"], "dosya": "06-acik-veri.md", "sira": 500, "kisa_tanim_duz": "Binlerce amatör ve resmî sensör, anlık sıcaklık, nem ve basınç verisini açık olarak paylaşır. Sitenize canlı bir veri katmanı eklemek için bu kaynaklar yeterlidir; çoğu ücretsiz ve JSON döner.", "alanlar": {"kisa_tanim": "<p>Binlerce amatör ve resmî sensör, anlık sıcaklık, nem ve basınç verisini açık olarak paylaşır. Sitenize canlı bir veri katmanı eklemek için bu kaynaklar yeterlidir; çoğu ücretsiz ve JSON döner.<\/p>", "esik": "<div class=\"tablo\"><table><thead><tr><th>Kaynak<\/th><th>Veri<\/th><th>Erişim<\/th><th>Kapsam / Not<\/th><\/tr><\/thead><tbody><tr><td><strong>Open-Meteo API<\/strong><\/td><td>Model tahmini + geçmiş + anlık (ECMWF, GFS, ICON…)<\/td><td>Ücretsiz, anahtar gerekmez, 10.000 istek/gün<\/td><td><code>api.open-meteo.com/v1/forecast?latitude=39.9&amp;longitude=32.8&amp;current=temperature_2m,dew_point_2m<\/code> — en kolay başlangıç<\/td><\/tr><tr><td><strong>Netatmo Weathermap<\/strong><\/td><td>Amatör istasyon anlık sıcaklık/nem/basınç<\/td><td>Ücretsiz API (OAuth), <code>getpublicdata<\/code><\/td><td>Türkiye'de büyük şehirlerde yüzlerce istasyon; yerleşim hatası olabilir<\/td><\/tr><tr><td><strong>Weather Underground PWS<\/strong><\/td><td>Kişisel istasyon ağı<\/td><td>Ücretsiz anahtar yalnız istasyon sahiplerine<\/td><td>Yaygın; yalnızca kendi istasyonunuz varsa API<\/td><\/tr><tr><td><strong>Sensor.Community<\/strong> (eski Luftdaten)<\/td><td>Açık donanım sıcaklık/nem/PM2.5<\/td><td>Tamamen açık, <code>data.sensor.community<\/code><\/td><td>Hava kalitesi odaklı; Türkiye'de sınırlı<\/td><\/tr><tr><td><strong>OpenWeatherMap<\/strong><\/td><td>Anlık + tahmin<\/td><td>Ücretsiz seviye 1.000 istek/gün<\/td><td>Kolay, ama kaynak şeffaf değil<\/td><\/tr><tr><td><strong>NOAA / Synoptic (MesoWest)<\/strong><\/td><td>Resmî ve mesonet istasyonlar<\/td><td>Ücretsiz akademik seviye<\/td><td>Türkiye için MGM SYNOP istasyonları dahil<\/td><\/tr><tr><td><strong>MGM<\/strong><\/td><td>Resmî istasyon anlık verisi<\/td><td>Resmî API yok; web sayfası gösterir<\/td><td>Kurumsal başvuru ile veri alınabilir<\/td><\/tr><tr><td><strong>OGIMET<\/strong><\/td><td>Dünya SYNOP/METAR arşivi<\/td><td>Ücretsiz web<\/td><td>Türkiye istasyonlarının 3 saatlik geçmişi<\/td><\/tr><tr><td><strong>METAR (havalimanları)<\/strong><\/td><td>Anlık gözlem<\/td><td><code>aviationweather.gov/data/api<\/code> — ücretsiz<\/td><td>LTAC Esenboğa, LTFM İstanbul vb. — en güvenilir kalibre veri<\/td><\/tr><\/tbody><\/table><\/div>", "nasil": "<p>Amatör ağlar veriyi kullanıcının cihazından buluta, oradan API'ye taşır. Resmî istasyonlar WMO standartlarında (2 m yükseklik, gölgede, çimen üstünde) ölçer; amatör sensörler balkonda güneş görebilir, duvara yakın olabilir. Bu yüzden sitenizde <strong>kaynak tipini<\/strong> (resmî / amatör) her sensör noktasında gösterin.<\/p>", "ornek": "<p>Ankara için Open-Meteo'dan model sıcaklığı, Esenboğa METAR'dan resmî ölçüm, Netatmo'dan Çankaya'daki 30 amatör istasyonun ortalamasını aynı haritada gösterin: aradaki 2–3°C fark, kentsel ısı adası kartını canlı olarak doğrular.<\/p>", "hata": "<p>Amatör istasyon verisini filtrelemeden ortalamaya katmak. Güneş gören sensör öğlen 5–8°C yüksek gösterir; komşularından 3°C'den fazla sapan istasyonu dışarıda bırakın (medyan filtre).<\/p>"}, "kaynaklar": ["Open-Meteo dokümantasyonu — API parametreleri ve limitler", "Netatmo Developer Portal — <code>getpublicdata<\/code> uç noktası", "WMO Guide No. 8 — istasyon yerleşim standartları"], "tutarlilik": {"seviye": "orta", "simge": "🟡", "not": "kaynak listesi güncel; limitler ve ücretler değişken", "dogrulama": "2026-09-08", "celiski": "API limitleri ve ücretsiz seviyeler sık değişir; <strong>bu kart 3 ayda bir yeniden doğrulanmalıdır.<\/strong>", "yeniden_dogrulama": "2026-12-07", "seviye_adi": "Orta", "yeniden_dogrulama_ay": 3}}, {"id": "kendi-sensorunuzu-siteye-baglama", "baslik": "Kendi Sensörünüzü Siteye Bağlama", "kategori": "Açık Veri ve Sensörler", "kategori_id": "acik-veri-ve-sensorler", "seviye": "ileri", "etiketler": ["API", "sensör", "ESP32", "Netatmo", "open-meteo", "MQTT", "harita"], "dosya": "06-acik-veri.md", "sira": 501, "kisa_tanim_duz": "15 dolarlık bir ESP32 kartı ve BME280 sensörü ile 5 dakikada bir sıcaklık, nem ve basınç ölçüp sitenize gönderebilirsiniz. Veri MQTT veya basit bir HTTP POST ile bir veritabanına yazılır, site oradan okur.", "alanlar": {"kisa_tanim": "<p>15 dolarlık bir ESP32 kartı ve BME280 sensörü ile 5 dakikada bir sıcaklık, nem ve basınç ölçüp sitenize gönderebilirsiniz. Veri MQTT veya basit bir HTTP POST ile bir veritabanına yazılır, site oradan okur.<\/p>", "esik": "<ul><li>Donanım: ESP32 (Wi-Fi) + BME280 (sıcaklık ±1°C, nem ±3 %, basınç ±1 hPa) + radyasyon kalkanı (güneş koruması, şart)<\/li><li>Ölçüm aralığı: 5–10 dakika; daha sık gereksiz, pil ve API yükü artar<\/li><li>Veri akışı: <code>ESP32 → MQTT broker (Mosquitto) veya HTTP POST → Supabase / InfluxDB / basit JSON dosyası → site<\/code><\/li><li>Kalite kontrol: 1 saatte &gt; 5°C sıçrama → \"şüpheli\" işaretle; nem &gt; %100 → kırp; 3 ölçüm arka arkaya eksik → \"çevrimdışı\"<\/li><li>Deniz seviyesine indirgenmiş basınç: <code>P₀ = P × (1 − 0,0065·h / (T + 0,0065·h + 273,15))^(−5,257)<\/code> (h: metre, T: °C)<\/li><\/ul>", "nasil": "<p>Sensör I²C üzerinden ESP32'ye bağlanır. ESP32 Wi-Fi ile ölçümü JSON olarak gönderir: <code>{\"id\":\"ank-cankaya-01\",\"t\":18.4,\"rh\":42,\"p\":907.1,\"ts\":\"2026-09-08T14:05:00Z\"}<\/code>. Sunucu tarafında bir Supabase tablosu veya statik site için GitHub Actions ile her 10 dakikada güncellenen bir <code>data.json<\/code> yeterlidir. Site, Leaflet haritasına nokta olarak çizer ve son 24 saat grafiğini gösterir.<\/p>", "ornek": "<p>Balkona kurduğunuz sensör sabah 07:00'de 4°C ve çiğ noktası 3,5°C gösteriyor; site otomatik olarak \"Sis riski yüksek\" rozeti ve \"Çiğ noktası\" kartına bağlantı verir. Bu, sitenin eğitim ve canlı veri katmanını birleştiren en değerli özelliktir.<\/p>", "hata": "<p>Sensörü duvara veya güneş gören yere asmak. Radyasyon kalkanı olmadan ölçülen sıcaklık gündüz 5–10°C yüksek çıkar; verinin tamamı anlamsız olur. Kalkanı 3D yazıcı ile basabilir ya da iç içe geçmiş beyaz plastik tabaklarla yapabilirsiniz.<\/p>"}, "kaynaklar": ["Bosch BME280 datasheet — doğruluk değerleri", "WMO Guide No. 8 — radyasyon kalkanı ve 2 m yükseklik standardı", "Espressif ESP32 + Arduino MQTT örnekleri — bağlantı kodu"], "tutarlilik": {"seviye": "yuksek", "simge": "🟢", "not": "3/3 kaynak hemfikir", "dogrulama": "2026-09-08", "celiski": "", "yeniden_dogrulama": null, "seviye_adi": "Yüksek"}}]}</script>
<script>
(function () {
  const VERI = JSON.parse(document.getElementById('veri').textContent);
  const KARTLAR = VERI.kartlar;
  const SEVIYE_AD = { temel: 'Temel', orta: 'Orta', ileri: 'İleri' };
  const TUT_AD = { yuksek: 'Yüksek', orta: 'Orta', dusuk: 'Düşük' };
  const ALANLAR = [
    ['kisa_tanim', 'Kısa tanım', 'kisa'],
    ['esik', 'Eşik / Formül', 'esik'],
    ['nasil', 'Nasıl çalışır', 'nasil'],
    ['ornek', 'Günlük hayattan örnek', 'ornek'],
    ['hata', 'Sık yapılan hata', 'hata'],
  ];
  const BUGUN = new Date().toISOString().slice(0, 10);

  const durum = { q: '', kategori: '', seviye: '', tutarlilik: '' };
  let gorunen = KARTLAR.slice();

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const duz = (h) => h.replace(/<[^>]+>/g, ' ');
  const tarih = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
  const norm = (s) => s.toLocaleLowerCase('tr').replace(/i̇/g, 'i');

  KARTLAR.forEach((k) => {
    k._metin = norm([k.baslik, k.kategori, k.etiketler.join(' '), k.kisa_tanim_duz,
      ...Object.values(k.alanlar).map(duz), k.kaynaklar.map(duz).join(' ')].join(' '));
  });

  // ---- özet ----
  const sayim = { yuksek: 0, orta: 0, dusuk: 0 };
  KARTLAR.forEach((k) => { if (k.tutarlilik.seviye) sayim[k.tutarlilik.seviye]++; });
  $('ozet').innerHTML =
    `<span><b>${KARTLAR.length}</b> kart</span><span><b>${VERI.kategoriler.length}</b> kategori</span>` +
    `<span><span class="nokta" style="background:var(--iyi)"></span><b>${sayim.yuksek}</b> yüksek tutarlılık</span>` +
    `<span><span class="nokta" style="background:var(--uyari)"></span><b>${sayim.orta}</b> orta</span>` +
    (sayim.dusuk ? `<span><span class="nokta" style="background:var(--kritik)"></span><b>${sayim.dusuk}</b> düşük</span>` : '') +
    `<span>son doğrulama <b>${tarih(VERI.son_dogrulama)}</b></span>`;
  $('dip').innerHTML = `kartlar/*.md → build.py → bu sayfa · üretim ${VERI.uretim.replace('T', ' ')} · <a href="/istatistik">istatistik</a>`;

  // ---- kategori çipleri ----
  const katKap = $('kategoriler');
  const cipler = [{ id: '', ad: 'Tümü', kart_sayisi: KARTLAR.length }, ...VERI.kategoriler];
  katKap.innerHTML = cipler.map((c) =>
    `<button class="cip" type="button" data-id="${esc(c.id)}" aria-pressed="${c.id === '' ? 'true' : 'false'}">${esc(c.ad)}<span class="n">${c.kart_sayisi}</span></button>`
  ).join('');
  katKap.addEventListener('click', (e) => {
    const b = e.target.closest('.cip'); if (!b) return;
    durum.kategori = b.dataset.id;
    katKap.querySelectorAll('.cip').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    ciz();
  });

  $('ara').addEventListener('input', (e) => { durum.q = norm(e.target.value.trim()); ciz(); });
  $('seviye').addEventListener('change', (e) => { durum.seviye = e.target.value; ciz(); });
  $('tutarlilik').addEventListener('change', (e) => { durum.tutarlilik = e.target.value; ciz(); });

  // ---- ızgara ----
  function tutHtml(t, uzun) {
    if (!t.seviye) return '';
    return `<span class="tut ${t.seviye}"><span class="nokta"></span>${TUT_AD[t.seviye]}${uzun && t.not ? ` · ${esc(t.not)}` : ''}</span>`;
  }
  function ciz() {
    const kelimeler = durum.q.split(/\s+/).filter(Boolean);
    gorunen = KARTLAR.filter((k) =>
      (!durum.kategori || k.kategori_id === durum.kategori) &&
      (!durum.seviye || k.seviye === durum.seviye) &&
      (!durum.tutarlilik || k.tutarlilik.seviye === durum.tutarlilik) &&
      kelimeler.every((w) => k._metin.includes(w)));
    $('sayac').textContent = `${gorunen.length} / ${KARTLAR.length} kart`;
    if (!gorunen.length) {
      $('izgara').innerHTML = `<div class="bos"><b>Eşleşen kart yok</b>Aramayı kısaltın ya da kategori ve seviye filtresini kaldırın.</div>`;
      return;
    }
    $('izgara').innerHTML = gorunen.map((k) => `
      <article class="kart" tabindex="0" role="button" data-id="${esc(k.id)}" aria-label="${esc(k.baslik)}">
        <div class="ust-satir"><span class="gozcu">${esc(k.kategori)}</span><span class="seviye">${SEVIYE_AD[k.seviye] || esc(k.seviye)}</span></div>
        <h2>${esc(k.baslik)}</h2>
        <p>${esc(k.kisa_tanim_duz)}</p>
        <div class="alt-satir">${tutHtml(k.tutarlilik)}<span class="etiketler">${k.etiketler.slice(0, 3).map((e) => `<span>#${esc(e)}</span>`).join('')}</span></div>
      </article>`).join('');
  }
  $('izgara').addEventListener('click', (e) => { const a = e.target.closest('.kart'); if (a) ac(a.dataset.id); });
  $('izgara').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const a = e.target.closest('.kart'); if (!a) return;
    e.preventDefault(); ac(a.dataset.id);
  });

  // ---- tam kart ----
  const dialog = $('dialog');
  let acikId = null;
  function ac(id, hashYaz = true) {
    const k = KARTLAR.find((x) => x.id === id); if (!k) return;
    acikId = id;
    const liste = gorunen.some((x) => x.id === id) ? gorunen : KARTLAR;
    const i = liste.findIndex((x) => x.id === id);
    const onceki = liste[i - 1], sonraki = liste[i + 1];
    const t = k.tutarlilik;
    const gecmis = t.yeniden_dogrulama && t.yeniden_dogrulama < BUGUN;
    $('d-ic').innerHTML = `
      <div class="d-ust">
        <div class="meta">
          <div class="ust-satir" style="justify-content:flex-start;gap:12px"><span class="gozcu">${esc(k.kategori)}</span><span class="seviye">${SEVIYE_AD[k.seviye] || esc(k.seviye)}</span></div>
          <h2 id="d-baslik">${esc(k.baslik)}</h2>
          <div class="d-etiket">${k.etiketler.map((e) => `<span>#${esc(e)}</span>`).join('')}</div>
        </div>
        <button class="kapat" type="button" aria-label="Kapat" data-kapat>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="d-govde">
        ${ALANLAR.map(([key, ad, cls]) => k.alanlar[key] ? `<section class="alan ${cls}"><div class="ad">${ad}</div><div class="icerik">${k.alanlar[key]}</div></section>` : '').join('')}
        ${k.kaynaklar.length ? `<section class="alan kaynaklar"><div class="ad">Kaynaklar</div><div class="icerik"><ol>${k.kaynaklar.map((s) => `<li>${s}</li>`).join('')}</ol></div></section>` : ''}
      </div>
      <div class="d-alt ${t.seviye || ''}">
        <div class="ad">Tutarlılık</div>
        <div>
          ${tutHtml(t, true)}
          <div class="detay">Son doğrulama <span class="mono">${tarih(t.dogrulama)}</span>${t.yeniden_dogrulama ? ` · ${t.yeniden_dogrulama_ay} ayda bir yeniden doğrulanmalı, sıradaki <span class="mono ${gecmis ? 'gecmis' : ''}">${tarih(t.yeniden_dogrulama)}</span>${gecmis ? ' (süresi geçti)' : ''}` : ''}</div>
          ${t.celiski ? `<div class="celiski"><b>Çelişki:</b> ${t.celiski}</div>` : ''}
        </div>
      </div>
      <div class="d-nav">
        <button type="button" data-git="${onceki ? esc(onceki.id) : ''}" ${onceki ? '' : 'disabled'}>← ${onceki ? esc(onceki.baslik) : 'İlk kart'}</button>
        <button type="button" data-git="${sonraki ? esc(sonraki.id) : ''}" ${sonraki ? '' : 'disabled'}>${sonraki ? esc(sonraki.baslik) : 'Son kart'} →</button>
      </div>`;
    if (!dialog.open) dialog.showModal();
    dialog.querySelector('.d-govde').scrollTop = 0;
    if (hashYaz) history.replaceState(null, '', '#' + id);
    window.olcum && window.olcum({ tip: 'kart', id });
  }
  dialog.addEventListener('click', (e) => {
    if (e.target.closest('[data-kapat]')) { dialog.close(); return; }
    const g = e.target.closest('[data-git]'); if (g && g.dataset.git) { ac(g.dataset.git); return; }
    if (e.target === dialog) dialog.close();
  });
  dialog.addEventListener('close', () => {
    acikId = null;
    history.replaceState(null, '', location.pathname + location.search);
  });
  dialog.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const b = dialog.querySelectorAll('.d-nav button')[e.key === 'ArrowLeft' ? 0 : 1];
      if (b && !b.disabled) ac(b.dataset.git);
    }
  });

  ciz();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) ac(h, false);
  window.addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id && id !== acikId) ac(id, false);
  });
})();
</script>

<script>
// Ziyaret ve aktif süre ölçümü. Çerez yok, kişisel veri yok; yalnızca toplam sayaçlar.
(function () {
  if (location.protocol === 'file:') return;
  const UC = '/api/istatistik';
  const gonder = (veri) => {
    try {
      const blob = new Blob([JSON.stringify(veri)], { type: 'application/json' });
      if (!(navigator.sendBeacon && navigator.sendBeacon(UC, blob))) {
        fetch(UC, { method: 'POST', body: blob, keepalive: true }).catch(() => {});
      }
    } catch (e) { /* sessiz */ }
  };
  window.olcum = gonder;
  let yeni = false;
  try { if (!localStorage.getItem('olcum-ilk')) { localStorage.setItem('olcum-ilk', '1'); yeni = true; } } catch (e) {}
  gonder({ tip: 'giris', yeni });
  let baslangic = document.visibilityState === 'visible' ? Date.now() : null;
  const bosalt = () => {
    if (baslangic === null) return;
    const sn = (Date.now() - baslangic) / 1000;
    baslangic = null;
    if (sn >= 1) gonder({ tip: 'sure', sn: Math.round(sn) });
  };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') bosalt();
    else if (baslangic === null) baslangic = Date.now();
  });
  window.addEventListener('pagehide', bosalt);
})();
</script>
