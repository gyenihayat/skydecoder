<style>
:root {
  --zemin: #EEF2F6;
  --yuzey: #FFFFFF;
  --yuzey2: #F5F7FA;
  --murekkep: #16212E;
  --murekkep2: #4E5E70;
  --murekkep3: #7B8A9B;
  --cizgi: #D5DDE6;
  --cizgi2: #E6EBF1;
  --vurgu: #1D4F91;
  --vurgu-metin: #1D4F91;
  --vurgu-yumusak: #E3ECF8;
  --vurgu-uzeri: #FFFFFF;
  --iyi: #2C7A4B;   --iyi-zemin: #E4F2E9;
  --uyari: #A8701A; --uyari-zemin: #FBF0DC;
  --kritik: #B3372E; --kritik-zemin: #F9E4E1;
  --golge: 0 1px 2px rgba(22,33,46,.06), 0 8px 24px rgba(22,33,46,.08);
  --golge-dialog: 0 24px 64px rgba(10,20,30,.35);
  --govde: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --baslik: "Fraunces", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #0E141C; --yuzey: #16202B; --yuzey2: #1B2632;
    --murekkep: #E6ECF3; --murekkep2: #A3B1C1; --murekkep3: #71818F;
    --cizgi: #2B3846; --cizgi2: #222E3B;
    --vurgu: #7FB0EA; --vurgu-metin: #9CC3F2; --vurgu-yumusak: #1B2E46; --vurgu-uzeri: #0E141C;
    --iyi: #6CC48A; --iyi-zemin: #17301F;
    --uyari: #E0B457; --uyari-zemin: #352A12;
    --kritik: #E7746B; --kritik-zemin: #3B1B18;
    --golge: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --golge-dialog: 0 24px 64px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --zemin: #0E141C; --yuzey: #16202B; --yuzey2: #1B2632;
  --murekkep: #E6ECF3; --murekkep2: #A3B1C1; --murekkep3: #71818F;
  --cizgi: #2B3846; --cizgi2: #222E3B;
  --vurgu: #7FB0EA; --vurgu-metin: #9CC3F2; --vurgu-yumusak: #1B2E46; --vurgu-uzeri: #0E141C;
  --iyi: #6CC48A; --iyi-zemin: #17301F;
  --uyari: #E0B457; --uyari-zemin: #352A12;
  --kritik: #E7746B; --kritik-zemin: #3B1B18;
  --golge: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --golge-dialog: 0 24px 64px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--zemin); color: var(--murekkep);
  font-family: var(--govde); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .92em; background: var(--yuzey2); border: 1px solid var(--cizgi2); padding: .05em .35em; border-radius: 3px; white-space: nowrap; }
strong { font-weight: 600; }

/* ---------- Üst bölüm ---------- */
.ust { max-width: 1180px; margin: 0 auto; padding: 40px 24px 12px; }
.ust h1 {
  font-family: var(--baslik); font-weight: 500; font-size: clamp(30px, 4vw, 44px);
  line-height: 1.1; margin: 0 0 8px; letter-spacing: -.01em; text-wrap: balance;
  font-variation-settings: "opsz" 120;
}
.ust h1 em { font-style: italic; color: var(--vurgu-metin); }
.ust .alt { color: var(--murekkep2); margin: 0; max-width: 62ch; }
.ozet { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 18px; font-family: var(--mono); font-size: 12.5px; color: var(--murekkep2); font-variant-numeric: tabular-nums; }
.ozet b { color: var(--murekkep); font-weight: 500; }
.ozet .nokta { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* ---------- Araç çubuğu ---------- */
.arac { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--zemin) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--cizgi2); }
.arac-ic { max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; flex-direction: column; gap: 10px; }
.satir { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ara { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 6px; padding: 0 10px; height: 38px; }
.ara:focus-within { border-color: var(--vurgu); box-shadow: 0 0 0 3px var(--vurgu-yumusak); }
.ara svg { width: 16px; height: 16px; color: var(--murekkep3); flex: none; }
.ara input { flex: 1; border: 0; background: transparent; outline: 0; min-width: 0; }
.ara input::placeholder { color: var(--murekkep3); }
select { height: 38px; border: 1px solid var(--cizgi); border-radius: 6px; background: var(--yuzey); padding: 0 10px; }
.sayac { font-family: var(--mono); font-size: 12.5px; color: var(--murekkep2); margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kategoriler { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.kategoriler::-webkit-scrollbar { display: none; }
.cip { flex: none; border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; color: var(--murekkep2); }
.cip .n { font-family: var(--mono); font-size: 11px; color: var(--murekkep3); }
.cip:hover { border-color: var(--murekkep3); color: var(--murekkep); }
.cip[aria-pressed="true"] { background: var(--vurgu); border-color: var(--vurgu); color: var(--vurgu-uzeri); }
.cip[aria-pressed="true"] .n { color: var(--vurgu-uzeri); opacity: .75; }

/* ---------- Kart ızgarası ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 22px 24px 64px; }
.izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.kart {
  background: var(--yuzey); border: 1px solid var(--cizgi2); border-radius: 8px;
  padding: 18px 18px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; text-align: left;
}
.kart:hover { transform: translateY(-2px); box-shadow: var(--golge); border-color: var(--cizgi); }
.ust-satir { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gozcu { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--vurgu-metin); font-weight: 600; }
.seviye { font-family: var(--mono); font-size: 11px; color: var(--murekkep3); border: 1px solid var(--cizgi); border-radius: 4px; padding: 1px 6px; }
.kart h2 { font-family: var(--baslik); font-weight: 600; font-size: 20px; line-height: 1.25; margin: 0; text-wrap: balance; font-variation-settings: "opsz" 36; }
.kart p { margin: 0; color: var(--murekkep2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.kart .alt-satir { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--cizgi2); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--murekkep3); }
.tut { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.tut .nokta { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tut.yuksek { --c: var(--iyi); color: var(--iyi); }
.tut.orta { --c: var(--uyari); color: var(--uyari); }
.tut.dusuk { --c: var(--kritik); color: var(--kritik); }
.etiketler { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.etiketler span { white-space: nowrap; }
.bos { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--murekkep2); }
.bos b { display: block; font-family: var(--baslik); font-size: 22px; font-weight: 500; color: var(--murekkep); margin-bottom: 6px; }

/* ---------- Tam kart (dialog) ---------- */
dialog {
  border: 0; padding: 0; background: var(--yuzey); color: var(--murekkep); border-radius: 10px;
  width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--golge-dialog);
}
dialog::backdrop { background: rgba(8, 14, 22, .55); backdrop-filter: blur(3px); }
.d-ic { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.d-ust { padding: 22px 28px 16px; border-bottom: 1px solid var(--cizgi2); display: flex; gap: 16px; align-items: flex-start; }
.d-ust .meta { flex: 1; min-width: 0; }
.d-ust h2 { font-family: var(--baslik); font-weight: 500; font-size: clamp(22px, 3vw, 30px); line-height: 1.15; margin: 6px 0 10px; text-wrap: balance; font-variation-settings: "opsz" 72; }
.d-etiket { display: flex; gap: 6px; flex-wrap: wrap; }
.d-etiket span { font-size: 12px; color: var(--murekkep2); background: var(--yuzey2); border: 1px solid var(--cizgi2); border-radius: 4px; padding: 2px 8px; }
.kapat { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--cizgi); background: var(--yuzey); cursor: pointer; display: grid; place-items: center; color: var(--murekkep2); }
.kapat:hover { background: var(--yuzey2); color: var(--murekkep); }
.d-govde { overflow-y: auto; padding: 8px 28px 24px; }
.alan { display: grid; grid-template-columns: 150px 1fr; gap: 6px 24px; padding: 16px 0; border-bottom: 1px solid var(--cizgi2); }
.alan:last-of-type { border-bottom: 0; }
.alan .ad { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--murekkep3); font-weight: 600; padding-top: 5px; }
.alan .icerik { min-width: 0; max-width: 68ch; }
.alan .icerik > :first-child { margin-top: 0; }
.alan .icerik > :last-child { margin-bottom: 0; }
.alan p { margin: 0 0 10px; }
.alan ul, .alan ol { margin: 0 0 10px; padding-left: 22px; }
.alan li { margin: 3px 0; }
.alan li::marker { color: var(--murekkep3); }
.alan.kisa .icerik { font-size: 17px; line-height: 1.5; font-weight: 500; }
.alan.hata .icerik { background: var(--uyari-zemin); border-left: 3px solid var(--uyari); padding: 10px 14px; border-radius: 0 6px 6px 0; }
.alan.kaynaklar ol { font-size: 14px; color: var(--murekkep2); }
.tablo { overflow-x: auto; margin: 0 0 10px; border: 1px solid var(--cizgi2); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--cizgi2); vertical-align: top; }
th { background: var(--yuzey2); font-weight: 600; font-size: 12px; color: var(--murekkep2); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
.d-alt { border-top: 1px solid var(--cizgi2); background: var(--yuzey2); padding: 14px 28px; display: grid; grid-template-columns: 150px 1fr; gap: 4px 24px; align-items: start; border-left: 4px solid var(--c, var(--cizgi)); }
.d-alt.yuksek { --c: var(--iyi); } .d-alt.orta { --c: var(--uyari); } .d-alt.dusuk { --c: var(--kritik); }
.d-alt .ad { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--murekkep3); font-weight: 600; padding-top: 3px; }
.d-alt .tut { font-size: 13px; font-weight: 500; }
.d-alt .detay { font-size: 13px; color: var(--murekkep2); margin-top: 3px; }
.d-alt .detay .mono { font-family: var(--mono); font-size: 12px; }
.d-alt .celiski { margin-top: 6px; font-size: 13px; }
.d-alt .celiski b { color: var(--murekkep); }
.d-alt .gecmis { color: var(--kritik); font-weight: 500; }
.d-nav { display: flex; justify-content: space-between; gap: 10px; padding: 12px 28px; border-top: 1px solid var(--cizgi2); }
.d-nav button { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--murekkep2); max-width: 48%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-nav button:hover:not(:disabled) { color: var(--murekkep); border-color: var(--murekkep3); }
.d-nav button:disabled { opacity: .4; cursor: default; }

footer.dip a { color: var(--vurgu-metin); }
footer.dip { max-width: 1180px; margin: 0 auto; padding: 0 24px 40px; font-size: 12.5px; color: var(--murekkep3); font-family: var(--mono); }

@media (max-width: 640px) {
  .ust { padding: 28px 16px 8px; }
  .arac-ic, main { padding-left: 16px; padding-right: 16px; }
  .alan, .d-alt { grid-template-columns: 1fr; gap: 4px; }
  .d-ust, .d-govde, .d-alt, .d-nav { padding-left: 18px; padding-right: 18px; }
  .sayac { width: 100%; margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .kart { transition: none; }
  .kart:hover { transform: none; }
}
</style>
