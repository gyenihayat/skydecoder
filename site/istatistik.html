<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İstatistik · Weather Literacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light dark;
  --zemin: #EEF2F6; --yuzey: #FFFFFF; --yuzey2: #F5F7FA;
  --murekkep: #16212E; --murekkep2: #4E5E70; --murekkep3: #7B8A9B;
  --cizgi: #D5DDE6; --cizgi2: #E6EBF1;
  --vurgu: #1D4F91; --vurgu-metin: #1D4F91; --vurgu-yumusak: #E3ECF8;
  --kritik: #B3372E; --kritik-zemin: #F9E4E1;
  --govde: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --baslik: "Fraunces", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --zemin: #0E141C; --yuzey: #16202B; --yuzey2: #1B2632;
    --murekkep: #E6ECF3; --murekkep2: #A3B1C1; --murekkep3: #71818F;
    --cizgi: #2B3846; --cizgi2: #222E3B;
    --vurgu: #7FB0EA; --vurgu-metin: #9CC3F2; --vurgu-yumusak: #1B2E46;
    --kritik: #E7746B; --kritik-zemin: #3B1B18;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--zemin); color: var(--murekkep); font-family: var(--govde); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--vurgu-metin); }
.sayfa { max-width: 960px; margin: 0 auto; padding: 40px 24px 64px; }
.geri { font-size: 13px; text-decoration: none; color: var(--murekkep2); }
h1 { font-family: var(--baslik); font-weight: 500; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 10px 0 6px; letter-spacing: -.01em; font-variation-settings: "opsz" 120; }
.alt { color: var(--murekkep2); margin: 0 0 24px; }
.kutular { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 28px; }
.kutu { background: var(--yuzey); border: 1px solid var(--cizgi2); border-radius: 8px; padding: 16px 18px; }
.kutu .ad { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--murekkep3); font-weight: 600; }
.kutu .deger { font-family: var(--baslik); font-size: 34px; font-weight: 500; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; font-variation-settings: "opsz" 72; }
.kutu .not { font-family: var(--mono); font-size: 12px; color: var(--murekkep2); margin-top: 4px; }
h2 { font-family: var(--baslik); font-weight: 500; font-size: 22px; margin: 28px 0 10px; }
.tablo { overflow-x: auto; border: 1px solid var(--cizgi2); border-radius: 8px; background: var(--yuzey); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--cizgi2); }
th { background: var(--yuzey2); font-weight: 600; font-size: 12px; color: var(--murekkep2); }
td.sayi, th.sayi { text-align: right; font-family: var(--mono); font-size: 13px; }
tbody tr:last-child td { border-bottom: 0; }
.cubuk { display: inline-block; height: 8px; background: var(--vurgu); border-radius: 2px; vertical-align: middle; margin-right: 8px; min-width: 2px; opacity: .85; }
.uyari { background: var(--kritik-zemin); border-left: 3px solid var(--kritik); padding: 12px 16px; border-radius: 0 6px 6px 0; margin: 12px 0; }
.uyari code { font-family: var(--mono); font-size: 12.5px; }
.sessiz { color: var(--murekkep3); font-family: var(--mono); font-size: 12.5px; margin-top: 28px; }
</style>
</head>
<body>
<div class="sayfa">
  <a class="geri" href="/">← Kartlara dön</a>
  <h1>Site İstatistikleri</h1>
  <p class="alt">Ziyaret sayısı, sitede kalma süresi ve en çok açılan kartlar. Çerez ve kişisel veri tutulmaz; yalnızca toplam sayaçlar.</p>
  <div id="icerik"><p class="sessiz">Yükleniyor…</p></div>
  <p class="sessiz" id="dip"></p>
</div>
<script>
(async function () {
  const el = document.getElementById('icerik');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tarih = (iso) => { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
  const sure = (sn) => {
    sn = Math.round(sn || 0);
    if (sn < 60) return `${sn} sn`;
    const dk = Math.floor(sn / 60), s = sn % 60;
    if (dk < 60) return `${dk} dk ${String(s).padStart(2, '0')} sn`;
    return `${Math.floor(dk / 60)} sa ${dk % 60} dk`;
  };
  const baslik = (id) => id.replace(/-/g, ' ');
  let v;
  try {
    const r = await fetch('/api/istatistik', { cache: 'no-store' });
    v = await r.json();
    if (!r.ok) throw new Error(v.hata || r.status);
  } catch (e) {
    el.innerHTML = `<div class="uyari"><b>İstatistik alınamadı.</b><br><code>${esc(e.message)}</code></div>`;
    return;
  }
  const son7 = v.gunluk.slice(0, 7).reduce((a, g) => a + g.ziyaret, 0);
  const maxZ = Math.max(1, ...v.gunluk.map((g) => g.ziyaret));
  const maxK = Math.max(1, ...v.kartlar.map((k) => k.adet));
  el.innerHTML = `
    <div class="kutular">
      <div class="kutu"><div class="ad">Toplam giriş</div><div class="deger">${v.toplam_ziyaret.toLocaleString('tr')}</div><div class="not">${v.baslangic ? tarih(v.baslangic) + ' tarihinden beri' : 'henüz kayıt yok'}</div></div>
      <div class="kutu"><div class="ad">Tekil ziyaretçi</div><div class="deger">${v.tekil_ziyaretci.toLocaleString('tr')}</div><div class="not">tarayıcı başına bir kez</div></div>
      <div class="kutu"><div class="ad">Bugün</div><div class="deger">${v.bugun.ziyaret.toLocaleString('tr')}</div><div class="not">son 7 gün ${son7.toLocaleString('tr')}</div></div>
      <div class="kutu"><div class="ad">Ortalama kalma süresi</div><div class="deger">${sure(v.sure_ort_sn)}</div><div class="not">toplam ${sure(v.sure_toplam_sn)}</div></div>
    </div>
    <h2>Son 30 gün</h2>
    <div class="tablo"><table>
      <thead><tr><th>Gün</th><th>Giriş</th><th class="sayi">Sayı</th><th class="sayi">Ort. süre</th></tr></thead>
      <tbody>${v.gunluk.map((g) => `<tr><td>${tarih(g.gun)}</td><td><span class="cubuk" style="width:${Math.round(180 * g.ziyaret / maxZ)}px"></span></td><td class="sayi">${g.ziyaret}</td><td class="sayi">${g.ziyaret ? sure(g.sure_ort_sn) : '—'}</td></tr>`).join('')}</tbody>
    </table></div>
    <h2>En çok açılan kartlar</h2>
    ${v.kartlar.length ? `<div class="tablo"><table>
      <thead><tr><th>Kart</th><th></th><th class="sayi">Açılma</th></tr></thead>
      <tbody>${v.kartlar.map((k) => `<tr><td><a href="/#${esc(k.id)}">${esc(baslik(k.id))}</a></td><td><span class="cubuk" style="width:${Math.round(180 * k.adet / maxK)}px"></span></td><td class="sayi">${k.adet}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="sessiz">Henüz kart açılmadı.</p>'}`;
  document.getElementById('dip').textContent = 'Süre, sekme görünürken geçen aktif zamandır; sekme arka plana alınınca sayaç durur.';
})();
</script>
</body>
</html>
